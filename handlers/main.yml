---

- name: Systemd daemon reload
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Remount home
  ansible.posix.mount:
    name: "{{ rhel10stig_home_filesystem }}"
    state: remounted

- name: Remount dev_shm
  ansible.posix.mount:
    name: /dev/shm
    state: remounted

- name: Remount tmp
  ansible.posix.mount:
    name: /tmp
    state: remounted

- name: Remount var
  ansible.posix.mount:
    name: /var
    state: remounted

- name: Remount var_log
  ansible.posix.mount:
    name: /var/log
    state: remounted

- name: Remount var_log_audit
  ansible.posix.mount:
    name: /var/log/audit
    state: remounted

- name: Remount var_tmp
  ansible.posix.mount:
    name: /var/tmp
    state: remounted

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true

- name: Restart chronyd
  when: not system_is_container
  ansible.builtin.systemd_service:
    name: chronyd
    state: restarted
  listen: Restart chronyd

- name: Restart usbguard
  ansible.builtin.systemd_service:
    name: usbguard
    state: restarted
  listen: Restart usbguard

- name: Restart NetworkManager
  when: "'NetworkManager' in ansible_facts['packages']"
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: restarted

- name: Restart sshd service
  ansible.builtin.systemd_service:
    name: sshd
    state: restarted

- name: Rebuild grub
  when: not system_is_container
  ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg --update-bls-cmdline
  changed_when: true

- name: Reinstall crypto policies
  ansible.builtin.command: dnf -y reinstall crypto-policies
  changed_when: true
  listen: Install crypto policies

- name: Set crypto policies
  ansible.builtin.command: "update-crypto-policies --set {{ combined_crypto_policy_config }}"
  changed_when: true
  notify: Reboot required
  listen: Install crypto policies

- name: Set FIPS mode
  when: not system_is_container
  ansible.builtin.command: grubby --update-kernel=ALL --args="fips=1"
  changed_when: true
  listen: Install crypto policies

- name: Restart sssd
  when: '"sssd" in ansible_facts[''packages'']'
  ansible.builtin.systemd_service:
    name: sssd
    state: restarted

- name: Update dconf
  when: "'dconf' in ansible_facts['packages']"
  ansible.builtin.command: dconf update
  changed_when: true

- name: Restart rsyslog
  when: not system_is_container
  ansible.builtin.systemd_service:
    name: rsyslog.service
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  listen: Restart_sysctl

- name: AIDE - Check for DB file
  ansible.builtin.stat:
    path: "{{ rhel10stig_aide_db_file }}"
  register: discovered_aide_db_file
  listen: Build aide

- name: AIDE - Discover age of DB
  when: discovered_aide_db_file.stat.exists
  ansible.builtin.find:
    path: "{{ rhel10stig_aide_db_file | dirname }}"
    pattern: "{{ rhel10stig_aide_db_file | basename }}"
    age: "{{ rhel10stig_aide_db_file_age }}"
  register: discovered_aide_db_age
  listen: Build aide

- name: "AIDE - Create DB if absent, forced or older than {{ rhel10stig_aide_db_file_age }}"
  when: not discovered_aide_db_file.stat.exists or
        (discovered_aide_db_age.files | length > 0) or
        rhel10stig_aide_db_recreate
  ansible.builtin.command: /usr/sbin/aide --init
  changed_when: true
  register: discovered_new_aide_db_created
  listen: Build aide

- name: "AIDE - Rename DB file if DB created"
  when:
    - not discovered_aide_db_file.stat.exists or
      (discovered_aide_db_age.files | length > 0) or
      rhel10stig_aide_db_recreate
    - discovered_new_aide_db_created.changed
  ansible.builtin.command: "mv -f {{ rhel10stig_aide_db_new_file }} {{ rhel10stig_aide_db_file }}"
  changed_when: true
  listen: Build aide

- name: AIDE - If DB exists run check comparison
  when:
    - discovered_aide_db_file.stat.exists
    - not discovered_new_aide_db_created.changed
  ansible.builtin.command: /usr/sbin/aide --check
  changed_when: true
  failed_when: discovered_aidedb_check.rc not in [ 0, 1, 4, 5, 7 ]
  register: discovered_aidedb_check
  listen: Build aide

- name: AIDE - Warning if checks fail
  when: discovered_aidedb_check.rc != 0
  ansible.builtin.import_tasks:
    file: warning_facts.yml
  vars:
    warn_control_id: "MEDIUM | RHEL-10-651010-Aide-Check"
  listen: Build aide

# Must be prior to fapolicyd restart

- name: Fapolicy set to non-permissive
  ansible.builtin.replace:
    path: /etc/fapolicyd/fapolicyd.conf
    regexp: ^permissive\s*=\s*1
    replace: permissive = 0
  listen: Restart fapolicyd

- name: Generate fapolicyd rules
  ansible.builtin.command: fagenrules --load
  changed_when: true
  listen: Restart fapolicyd

- name: Restart fapolicyd
  ansible.builtin.service:
    name: fapolicyd
    state: restarted
  listen: Restart fapolicyd

- name: Restart pcscd
  ansible.builtin.systemd_service:
    name: pcscd
    state: restarted
  listen: Restart pcscd

- name: Update aliases
  ansible.builtin.command: newaliases
  changed_when: true
  listen: Update aliases

## Auditd tasks note order for handlers to run

- name: Audit check augenrules
  when: not system_is_container
  ansible.builtin.command: augenrules --check
  changed_when: false
  register: discovered_augenrules_check
  listen: Auditd checks

- name: Auditd rules reload
  when:
    - not system_is_container
    - prelim_auditd_immutable_check.rc == 1 or discovered_augenrules_check.stdout is search('No change')
  ansible.builtin.command: augenrules --load
  changed_when: true
  failed_when: discovered_augenrule_check.rc not in [ 0, 1 ]
  register: discovered_augenrule_check
  listen: Auditd checks

- name: Audit immutable fact
  when:
    - not system_is_container
    - prelim_auditd_immutable_check is defined
  ansible.builtin.debug:
    msg: "Reboot required for auditd to apply new rules as immutable set"
  notify: Reboot required
  listen: Auditd checks

- name: Stop auditd process
  when:
    - not system_is_container
    - prelim_auditd_immutable_check is defined
  ansible.builtin.set_fact:
    change_requires_reboot: true
  listen: Auditd checks

- name: Start auditd process
  when:
    - not system_is_container
    - prelim_auditd_immutable_check is not defined
  ansible.builtin.systemd_service:
    name: auditd
    state: restarted
  listen: Auditd checks

- name: Reboot required
  ansible.builtin.set_fact:
    change_requires_reboot: true
