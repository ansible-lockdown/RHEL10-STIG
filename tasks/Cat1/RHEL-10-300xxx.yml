        msg: "Warning!! Investigate /etc/crypto-policies/back-ends/openssh.config for correct IPS 140-3 ciphers and order"

    - name: "HIGH | RHEL-10-300040 | WARN | The RHEL 10 SSH server must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections."
      when: prelim_current_fips_enabled.stdout != '1'
      ansible.builtin.debug:
        msg: "WARNING!! FIPS mode is not enabled. A new installation is required to enable FIPS mode."

    - name: "HIGH | RHEL-10-300040 | WARN | The RHEL 10 SSH server must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections."
      when:
        - not rhel10stig_disruption_high
        - "(rhel10stig_sshd_config_ciphers not in discovered_openssh_server_ciphers.stdout"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "HIGH | RHEL-10-300040"

