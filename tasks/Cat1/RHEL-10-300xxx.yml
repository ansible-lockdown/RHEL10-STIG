- name: "HIGH | RHEL-10-300070 | PATCH | RHEL 10 IP tunnels must use FIPS 140-2/140-3 approved cryptographic algorithms."
  when: rhel10stig_300070 and rhel10stig_200680
  tags:
    - RHEL-10-300070
    - CAT1
    - CCI-000068
    - SRG-OS-000033-GPOS-00014
    - SV-281014r1165397_rule
    - V-281014
    - NIST800-53R4_AC-17
    - ipsec
    - tunnel
  ansible.builtin.lineinfile:
    path: /etc/ipsec.conf
    regexp: ^(#?)\s*include /etc/crypto-policies/back-ends
    line: include /etc/crypto-policies/back-ends/libreswan.config
    create: true
    mode: 'u-x,g-wx,o-rwx'

- name: "HIGH | RHEL-10-300080 | PATCH | RHEL 10 must implement DOD-approved encryption in the bind package."
  when:
    - rhel10stig_300080
    - "'bind' in ansible_facts['packages']"
  tags:
    - RHEL-10-300080
    - CAT1
    - CCI-002418
    - CCI-002422
    - SRG-OS-000423-GPOS-00187
    - SRG-OS-000426-GPOS-00190
    - SV-258242r958908_rule
    - V-258242
    - NIST800-53R4_SC-8
    - bind
    - encryption
  ansible.builtin.lineinfile:
    path: /etc/named.conf
    regexp: ^(#?)\s*include "/etc/crypto-policies/back-ends/bind.config"
    line: 'include "/etc/crypto-policies/back-ends/bind.config";'

- name: "HIGH | RHEL-10-300090 | PATCH | RHEL 10 crypto policy must not be overridden."
  when:
    - rhel10stig_300090
    - not skip_fips_mode
  tags:
    - RHEL-10-300090
    - CAT1
    - CCI-002450
    - CCI-002890
    - CCI-003123
    - SRG-OS-000396-GPOS-00176
    - SRG-OS-000393-GPOS-00173
    - SRG-OS-000394-GPOS-00174
    - SV-258236r1101920_rule
    - V-258236
    - NIST800-53R4_SC-13
    - NIST800-53R4_MA-4
    - crypto
  block:
    - name: "HIGH | RHEL-10-300090 | AUDIT | RHEL 10 crypto policy must not be overridden. | capture files"
      ansible.builtin.command: update-crypto-policies --check
      changed_when: false
      register: discovered_fips_policies_check

    - name: "HIGH | RHEL-10-300090 | WARN | RHEL 10 crypto policy must not be overridden. | Set fact to run install again"
      when:
        - rhel10stig_disruption_high
        - "'The configured policy matches the generated policy' not in discovered_fips_policies_check.stdout"
      ansible.builtin.set_fact:
        crypto_policy_needs_install: true
      notify: Install crypto policies
