- name: "MEDIUM | RHEL-10-700980 | PATCH | RHEL 10 must disable the ability of systemd to spawn an interactive boot process."
  when: rhel10stig_700980
  tags:
    - RHEL-10-700980
    - CAT2
    - CCI-000381
    - SRG-OS-000095-GPOS-00049
    - SV-281300r1167050_rule
    - V-281300
    - NIST800-53R4_CM-6
  block:
    - name: "MEDIUM | RHEL-10-700980 | AUDIT | RHEL 10 must disable the ability of systemd to spawn an interactive boot process. | Capture grubby output"
      ansible.builtin.shell: |
        set -o pipefail
        grubby --info=ALL | grep args | grep 'systemd.confirm_spawn'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_systemd_spawn.rc not in [ 0, 1 ]
      register: discovered_systemd_spawn

    - name: "MEDIUM | RHEL-10-700980 | PATCH | RHEL 10 must disable the ability of systemd to spawn an interactive boot process. | Remove systemd.confirm_spawn from grubby"
      when: discovered_systemd_spawn.stdout | length > 0
      ansible.builtin.command: grubby --update-kernel=ALL --remove-args="systemd.confirm_spawn"
      changed_when: true

    - name: "MEDIUM | RHEL-10-700980 | PATCH | RHEL 10 must disable the ability of systemd to spawn an interactive boot process. | Edit default grub"
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '(.*)systemd.confirm_spawn=(1|yes|true|on)(.*)'
        replace: '\1\3'
      notify: Rebuild grub

- name: "MEDIUM | RHEL-10-700990 | PATCH | RHEL 10 must disable virtual system calls."
  when: rhel10stig_700990
  tags:
    - RHEL-10-700990
    - CAT2
    - CCI-001084
    - SRG-OS-000134-GPOS-00068
    - SV-281301r1184700_rule
    - V-281301
    - NIST800-SC-3
  block:
    - name: "MEDIUM | RHEL-10-700990 | AUDIT | RHEL 10 must disable virtual system calls. | Capture grubby output"
      ansible.builtin.shell: |
        set -o pipefail
        grubby --info=ALL | grep args | grep 'vsyscall=none'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_grubby_vsyscall.rc not in [ 0, 1 ]
      register: discovered_grubby_vsyscall

    - name: "MEDIUM | RHEL-10-700990 | PATCH | RHEL 10 must disable virtual system calls. | Amend grubby"
      when: discovered_grubby_vsyscall.stdout | length == 0
      ansible.builtin.command: grubby --update-kernel=ALL --args="vsyscall=none"
      changed_when: true

    - name: "MEDIUM | RHEL-10-700990 | AUDIT | RHEL 10 must disable virtual system calls. | Capture default grub"
      ansible.builtin.shell: |
        set -o pipefail
        grep "^GRUB_CMDLINE_LINUX=" /etc/default/grub | cut -f2 -d'"' | grep vsyscall
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_def_grub_vsyscall.rc not in [ 0, 1 ]
      register: discovered_def_grub_vsyscall

    - name: "MEDIUM | RHEL-10-700990 | PATCH | RHEL 10 must disable virtual system calls. | Set default"
      when: discovered_def_grub_vsyscall.rc != 0
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: ^(GRUB_CMDLINE_LINUX=")(.*)"
        line: '\1\2 vsyscall=none"'
        backrefs: true
      notify: Rebuild grub
