- name: "MEDIUM | RHEL-10-700200 | PATCH | RHEL 10 must prevent special devices on nonroot local partitions."
  when: rhel10stig_700200
  tags:
    - RHEL-10-700200
    - CAT2
    - CCI-001764
    - SRG-OS-000368-GPOS-00154
    - SV-281248r1166696_rule
    - V-281248
    - NIST800-53R4_CM-6
  block:
    - name: "MEDIUM | RHEL-10-700200 | AUDIT | RHEL 10 must prevent special devices on nonroot local partitions. | discover partition"
      ansible.builtin.shell: |
        set -o pipefail
        mount | grep '^/dev\S* on /\S' | grep -Ev 'nodev|vfat' | awk -F" " '{print $3}'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_non_root_missing_nodev.rc not in [ 0, 1 ]
      register: discovered_non_root_missing_nodev

    - name: "MEDIUM | RHEL-10-700200 | WARN | RHEL 10 must prevent special devices on nonroot local partitions."
      when: discovered_non_root_missing_nodev.stdout | length > 0
      ansible.builtin.debug:
        msg: "Warning!! The following filesystems are missing the nodev option {{
          discovered_non_root_missing_nodev.stdout_lines }}"

    - name: "MEDIUM | RHEL-10-700200 | WARN | RHEL 10 must prevent special devices on nonroot local partitions."
      when: discovered_non_root_missing_nodev.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-700200"

- name: "MEDIUM | RHEL-10-700400 | PATCH | RHEL 10 must enable the SELinux targeted policy."
  when: rhel10stig_700400
