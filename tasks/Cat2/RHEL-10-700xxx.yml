  when: rhel10stig_700930
  tags:
    - RHEL-10-700930
    - CAT2
    - CCI-001133
    - CCI-002361
    - CCI-002891
    - SRG-OS-000163-GPOS-00072
    - SV-281296r1184670_rule
    - V-281296
    - NIST800-53R4_CM-6
  notify: Restart sshd service
  block:
    - name: "MEDIUM | RHEL-10-700930 | AUDIT | RHEL 10 must be configured with a timeout interval for the Secure Shell (SSH) daemon."
      when: "item.path != rhel10stig_sshd_config_file"
      ansible.builtin.replace:
        path: "{{ item.path}}"
        regexp: (?i)^ClientAliveInterval\s*([1-9]|[1-5][0-9]{1,2}|600)
        replace: '#ClientAliveInterval \1'
      failed_when: discovered_clientaliveinterval_exists.rc not in [0, 257]
      register: discovered_clientaliveinterval_exists
      loop: "{{ prelim_sshd_config_files.files }}"

    - name: "MEDIUM | RHEL-10-700930 | AUDIT | RHEL 10 must be configured with a timeout interval for the Secure Shell (SSH) daemon."
      ansible.builtin.lineinfile:
        path: "{{ rhel10stig_sshd_config_file }}"
        regexp: (?i)^ClientAliveInterval\s*([1-9]|[1-5][0-9]{1,2}|600)
        line: ClientAliveInterval {{ rhel10stig_sshd_config_clientaliveinterval }}
        create: true
        mode: 'go-rwx'

