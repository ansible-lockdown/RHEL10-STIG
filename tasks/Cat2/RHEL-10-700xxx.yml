---

- name: PRELIM | Discover dconf systemdb
  when: rhel10stig_gui
  tags: always
  ansible.builtin.shell: |
    set -o pipefail
    grep system-db /etc/dconf/profile/user | cut -d ':' -f2
  args:
    executable: "{{ rhel10stig_shell_executable }}"
  changed_when: false
  failed_when: discovered_dconf_db.rc not in [ 0, 1 ]
  register: discovered_dconf_db

- name: "MEDIUM | RHEL-10-700010 | PATCH | RHEL 10 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access to the system via a Secure Shell (SSH) login."
  when: rhel10stig_700010
  tags:
    - RHEL-10-700010
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-281224r1184753_rule
    - V-281224
    - NIST800-53R4_AC-3
    - ssh
  notify: Restart sshd service
  ansible.builtin.template:
    src: etc/ssh/sshd_config.d/10-stig.conf.j2
    dest: /etc/ssh/sshd_config.d/10-stig.conf
    mode: 'u-x,go-wx'
    owner: root
    group: root
    validate: sshd -t -f %s

- name: "MEDIUM | RHEL-10-700020 | PATCH | RHEL 10 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access to the system via a graphical user login."
  when:
    - rhel10stig_700020
    - rhel10stig_gui
  tags:
    - RHEL-10-700020
    - CAT2
    - CCI-000048
    - CCI-001384
    - CCI-001385
    - CCI-001386
    - CCI-001387
    - CCI-001388
    - SRG-OS-000023-GPOS-00006
    - SRG-OS-000228-GPOS-00088
    - SV-281225r1166627_rule
    - V-281225
    - NIST800-53R4_AC-8
  block:
    - name: "MEDIUM | RHEL-10-700020 | PATCH | RHEL 10 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access to the system via a graphical user login."
      ansible.builtin.command: gsettings get org.gnome.login-screen banner-message-text
      changed_when: false
      failed_when: false
      register: discovered_banner_text

    - name: "MEDIUM | RHEL-10-700020 | PATCH | RHEL 10 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access to the system via a graphical user login."
      ansible.builtin.template:
        src: etc/dconf/db/local.d/01-banner-message.j2
        dest: /etc/dconf/db/local.d/01-banner-message
        mode: 'u-x,go-wx'
        owner: root
        group: root
        validate: dconf update
      notify: Update dconf

- name: "MEDIUM | RHEL-10-700030 | PATCH | RHEL 10 must prevent a user from overriding the banner-message-enable setting for the graphical user interface."
  when:
    - rhel10stig_700030
    - rhel10stig_gui
  tags:
    - RHEL-10-700030
    - CAT2
    - CCI-000048
    - CCI-001384
    - CCI-001385
    - CCI-001386
    - CCI-001387
    - CCI-001388
    - SRG-OS-000023-GPOS-00006
    - SV-281226r1166630_rule
    - V-281226
    - NIST800-53R4_CM-6
  notify: Update dconf
  ansible.builtin.lineinfile:
    path: /etc/dconf/db/local.d/locks/session
    line: /org/gnome/login-screen/banner-message-enable
    create: true
    mode: 'go-wx'
    state: present

- name: "MEDIUM | RHEL-10-700040 | PATCH | RHEL 10 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access to the system via a command line user login."
  when:
    - rhel10stig_700040
  tags:
    - RHEL-10-700040
    - CAT2
    - CCI-000048
    - CCI-001384
    - CCI-001385
    - CCI-001386
    - CCI-001387
    - CCI-001388
    - SRG-OS-000023-GPOS-00006
    - SV-281227r1184627_rule
    - V-281227
    - NIST800-53R4_AC-8
  block:
    - name: "MEDIUM | RHEL-10-700040 | PATCH | RHEL 10 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access to the system via a command line user login."
      ansible.builtin.template:
        src: etc/issue.net.j2
        dest: /etc/issue
        mode: 'u-x,go-wx'
        owner: root
        group: root

    - name: "MEDIUM | RHEL-10-700040 | PATCH | RHEL 10 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access to the system via a command line user login."
      ansible.builtin.stat:
        path: /etc/issue.net
      changed_when: false
      failed_when: false
      register: discovered_issue_net

    - name: "MEDIUM | RHEL-10-700040 | PATCH | RHEL 10 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access to the system via a command line user login."
      when:
        - discovered_issue_net.stat.exists
        - discovered_issue_net.stat.isreg
      ansible.builtin.file:
        path: /etc/issue.net
        state: absent

    - name: "MEDIUM | RHEL-10-700040 | PATCH | RHEL 10 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access to the system via a command line user login."
      when: not discovered_issue_net.stat.exists or discovered_issue_net.stat.isreg
      ansible.builtin.file:
        src: /etc/issue
        dest: /etc/issue.net
        state: link

- name: "MEDIUM | RHEL-10-700100 | PATCH | RHEL 10 must prevent special devices on file systems that are imported via Network File System (NFS)."
  when:
    - rhel10stig_700100
    - "'nfs-utils' in ansible_facts['packages']"
    - "'nodev' not in item.options"
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-700100
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-281228r1166636_rule
    - V-281228
    - NIST800-53R4_CM-6
  ansible.posix.mount:
    path: "{{ item.mount }}"
    src: "{{ item.device }}"
    fstype: "nfs"
    opts: "{{ item.options }},nodev"
    state: present
  loop: "{{ ansible_facts['mounts'] | selectattr('fstype', 'contains', 'nfs') | rejectattr('fstype',
    'equalto', 'autofs') | list }}"
  loop_control:
    label: "{{ item.device }}"

- name: "MEDIUM | RHEL-10-700105 | PATCH | RHEL 10 must prevent code from being executed on file systems that are imported via Network File System (NFS)."
  when:
    - rhel10stig_700105
    - "'nfs-utils' in ansible_facts['packages']"
    - "'noexec' not in item.options"
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-700105
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-281229r1166639_rule
    - V-281229
    - NIST800-53R4_CM-6
  ansible.posix.mount:
    path: "{{ item.mount }}"
    src: "{{ item.device }}"
    fstype: "nfs"
    opts: "{{ item.options }}{% if rhel10stig_700100 %},nodev{% endif %},noexec"
    state: present
  loop: "{{ ansible_facts['mounts'] | selectattr('fstype', 'contains', 'nfs') | rejectattr('fstype',
    'equalto', 'autofs') | list }}"
  loop_control:
    label: "{{ item.device }}"

- name: "MEDIUM | RHEL-10-700110 | PATCH | RHEL 10 must prevent files with the setuid and setgid bit set from being executed on file systems that are imported via Network File System (NFS)."
  when:
    - rhel10stig_700110
    - "'nfs-utils' in ansible_facts['packages']"
    - "'nosuid' not in item.options"
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-700110
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-281230r1166642_rule
    - V-281230
    - NIST800-53R4_CM-6
  ansible.posix.mount:
    path: "{{ item.mount }}"
    src: "{{ item.device }}"
    fstype: "nfs"
    opts: "{{ item.options }}{% if rhel10stig_700100 %},nodev{% endif %}{% if rhel10stig_700105
      %},noexec{% endif %},nosuid"
    state: present
  loop: "{{ ansible_facts['mounts'] | selectattr('fstype', 'contains', 'nfs') | rejectattr('fstype',
    'equalto', 'autofs') | list }}"
  loop_control:
    label: "{{ item.device }}"

- name: "MEDIUM | RHEL-10-700115 | PATCH | RHEL 10 must be configured so that the Network File System (NFS) is configured to use RPCSEC_GSS."
  when:
    - rhel10stig_700115
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-700115
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-281231r1166645_rule
    - V-281231
    - NIST800-53R4_IA-5
  community.general.ini_file:
    path: /etc/libuser.conf
    option: crypt_style
    section: 'default'
    value: 'sha512'
    mode: 'u-x,go-wx'

- name: "MEDIUM | RHEL-10-700120 | PATCH | RHEL 10 must mount /boot with the nodev option."
  when:
    - rhel10stig_700120 or rhel10stig_700135 or rhel10stig_700140
  tags:
    - RHEL-10-700120
    - RHEL-10-700135
    - RHEL-10-700140
    - CAT2
    - CCI-001764
    - SRG-OS-000368-GPOS-00154
    - SV-281232r1166648_rule
    - SV-281235r1166657_rule
    - SV-281236r1166660_rule
    - V-281232
    - V-281235
    - V-281236
    - NIST800-53R4_CM-7
  notify:
    - Reboot required
  block:
    - name: |
        "MEDIUM | RHEL-10-700120 | AUDIT | RHEL 10 must mount "/boot" with the "nodev" option.
         MEDIUM | RHEL-10-700135 | AUDIT | RHEL 10 must mount "/dev/shm" with the "nodev" option.
         MEDIUM | RHEL-10-700140 | AUDIT | RHEL 10 must mount "/dev/shm" with the "noexec" option.
      ansible.builtin.shell: |
        set -o pipefail
        mount | grep /dev/shm
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: false
      register: discovered_dev_shm_status

    - name: |
        "MEDIUM | RHEL-10-700120 | PATCH | RHEL 10 must mount "/boot" with the "nodev" option.
         MEDIUM | RHEL-10-700135 | PATCH | RHEL 10 must mount "/dev/shm" with the "nodev" option.
         MEDIUM | RHEL-10-700140 | PATCH | RHEL 10 must mount "/dev/shm" with the "noexec" option.
      when: discovered_dev_shm_status.stdout | length > 0
      ansible.posix.mount:
        path: /dev/shm
        src: mpfs
        fstype: tmpfs
        opts: "defaults{{ rhel10stig_700120 | ternary(',nodev', '') }}{{ rhel10stig_700135 | ternary(',noexec', '') }}{{ rhel10stig_700140 | ternary(',nosuid', '') }}"
        state: mounted

    - name: |
        "MEDIUM | RHEL-10-700120 | WARN | RHEL 10 must mount "/boot" with the "nodev" option.
         MEDIUM | RHEL-10-700135 | WARN | RHEL 10 must mount "/dev/shm" with the "nodev" option.
         MEDIUM | RHEL-10-700140 | WARN | RHEL 10 must mount "/dev/shm" with the "noexec" option.
      when: discovered_dev_shm_status.stdout | length == 0
      ansible.builtin.debug:
        msg: "Warning!! You have no /dev/shm mount"

    - name: |
        "MEDIUM | RHEL-10-700120 | WARN | RHEL 10 must mount "/boot" with the "nodev" option.
         MEDIUM | RHEL-10-700135 | WARN | RHEL 10 must mount "/dev/shm" with the "nodev" option.
         MEDIUM | RHEL-10-700140 | WARN | RHEL 10 must mount "/dev/shm" with the "noexec" option.
      when: discovered_dev_shm_status.stdout | length == 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-700120"

- name: "MEDIUM | RHEL-10-700125 | PATCH | RHEL 10 must prevent files with the setuid and setgid bit set from being executed on the /boot directory. | BIOS based OS"
  when:
    - rhel10stig_700125
    - item.mount == '/boot'
    - "'nosuid' not in item.options"
  tags:
    - RHEL-10-700125
    - CAT2
    - CCI-001764
    - SRG-OS-000368-GPOS-00154
    - SV-281233r1166651_rule
    - V-281233
    - NIST800-53R4_CM-7
  notify: Reboot required
  ansible.posix.mount:
    path: '/boot'
    src: "UUID={{ item.uuid }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.options }}{% if rhel10stig_700125 %},nodev{% endif %},nosuid"
    state: present
  loop: "{{ ansible_facts['mounts'] }}"
  loop_control:
    label: "{{ item.device }}"

- name: "MEDIUM | RHEL-10-700130 | PATCH | RHEL 10 must prevent files with the setuid and setgid bit set from being executed on the /boot/efi directory. | UEFI based OS"
