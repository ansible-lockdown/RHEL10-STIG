- name: "MEDIUM | RHEL-10-700410 | PATCH | RHEL 10 must elevate the SELinux context when an administrator calls the sudo command."
  when:
    - rhel10stig_700410
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-700410
    - CAT2
    - CCI-002235
    - SRG-OS-000324-GPOS-00125
    - SV-281250r1184704_rule
    - V-281250
    - NIST800-53R4_AC-6
    - selinux
    - disruption_high
    - sudo
  block:
    - name: "MEDIUM | RHEL-10-700410 | AUDIT | RHEL 10 must elevate the SELinux context when an administrator calls the sudo command."
      ansible.builtin.shell: |
        set -o pipefail
        semanage login -l | grep {{ rhel10stig_playbook_user }}
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      register: discovered_semanage_login
      changed_when: false
      failed_when: discovered_semanage_login.rc not in [ 0, 1 ]

    - name: "MEDIUM | RHEL-10-700410 | WARN | RHEL 10 must elevate the SELinux context when an administrator calls the sudo command."
      when: discovered_semanage_login.stdout | length == 0
      ansible.builtin.debug:
        msg: "Warning!! Selinux is not configured correctly for the system and user"

    - name: "MEDIUM | RHEL-10-700410 | WARN | RHEL 10 must elevate the SELinux context when an administrator calls the sudo command."
      when: discovered_semanage_login.stdout | length == 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-700410"

    - name: "MEDIUM | RHEL-10-700410 | PATCH | RHEL 10 must elevate the SELinux context when an administrator calls the sudo command."
      when: discovered_semanage_login.stdout | length > 0
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: ^(?!(#|root))(.*\s*ALL\s*=\s*.*\b)\sTYPE=sysadm_t ROLE=sysadm_r(.*)
        line: \1 TYPE=sysadm_t ROLE=sysadm_r    \2
        state: present
        backrefs: true
        validate: '/usr/sbin/visudo -cf %s'
      loop: "{{ prelim_sudoers_files.stdout_lines }}"

