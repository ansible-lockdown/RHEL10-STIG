      ansible.builtin.command: find -L /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -gid -999 -exec ls {} \;
      changed_when: false
      failed_when: discovered_sys_commands_group.rc not in [ 0, 1 ]
      register: discovered_sys_commands_group

    - name: "MEDIUM | RHEL-10-400105 | WARN | RHEL 10 system commands must be group-owned by root or a system account."
      when: discovered_sys_commands_group.stdout | length > 0
      ansible.builtin.debug:
        msg: |
            "Warning!! Please validate group ownership of the following system commands
             {{ discovered_sys_commands_group.stdout_lines }}"

    - name: "MEDIUM | RHEL-10-400105 | WARN | RHEL 10 system commands must be group-owned by root or a system account."
