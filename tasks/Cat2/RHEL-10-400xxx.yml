      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'u+x,g-w,o-rwx'
        state: directory
      loop: "{{ discovered_interactive_users_home_dirs.stdout_lines }}"

    # set default ACLs so the homedir has an effective umask of 0027
    - name: "MEDIUM | RHEL-10-400240 | PATCH | All RHEL 10 local interactive user home directories must have mode 0750 or less permissive. | Set group ACL"
      when: not system_is_container
      ansible.posix.acl:
        path: "{{ item }}"
        default: true
        etype: group
        permissions: rx
        state: present
      loop: "{{ discovered_interactive_users_home_dirs.stdout_lines }}"

    - name: "MEDIUM | RHEL-10-400240 | PATCH | RHEL 10 must enforce mode '0750' or less permissive for local interactive user home directories. | Set other ACL"
      when:
        - not system_is_container
        - item.stat.path is defined
      ansible.posix.acl:
        path: "{{ item }}"
        default: true
        etype: other
        permissions: 0
        state: present
      loop: "{{ discovered_interactive_users_home_dirs.stdout_lines }}"

