- name: PRELIM | Interactive User account home
  tags: always
  ansible.builtin.shell: |
    set -o pipefail
    cat /etc/passwd | grep -Ev "nologin|/sbin" | cut -d: -f6
  args:
    executable: "{{ rhel10stig_shell_executable }}"
  changed_when: false
  register: discovered_interactive_users_home_dirs

