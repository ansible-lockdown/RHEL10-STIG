- name: "MEDIUM | RHEL-10-400100 | PATCH | RHEL 10 system commands must be owned by root."
  when: rhel10stig_400100
  tags:
    - RHEL-10-400100
    - CAT2
    - CCI-001499
    - SRG-OS-000259-GPOS-00100
    - SV-257918r1044977_rule
    - V-257918
    - NIST800-53R4_CM-5
    - file_permissions
  block:
    - name: "MEDIUM | RHEL-10-400100 | AUDIT | RHEL 10 system commands must be owned by root."
      ansible.builtin.command: find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin /usr/local/sbin ! -user root -exec ls {} \;
      changed_when: false
      failed_when: discovered_sys_commands_owner.rc not in [ 0, 1 ]
      register: discovered_sys_commands_owner

    - name: "MEDIUM | RHEL-10-400100 | PATCH | RHEL 10 system commands must be owned by root."
      when: discovered_sys_commands_owner.stdout | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
      loop: "{{ discovered_sys_commands_owner.stdout_lines }}"

- name: "MEDIUM | RHEL-10-400105 | PATCH | RHEL 10 system commands must be group-owned by root or a system account."
  when:
    - rhel10stig_400105
