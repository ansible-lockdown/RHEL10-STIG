- name: "MEDIUM | RHEL-10-400140 | PATCH | RHEL 10 must be configured so that world-writable directories are owned by root, sys, bin, or an application user."
  when:
    - rhel10stig_400140
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-400140
    - CAT2
    - CCI-001090
    - SRG-OS-000138-GPOS-00069
    - SV-281045r1165490_rule
    - V-281045
    - NIST800-53R4_SC-4
    - file_permissions
  block:
    - name: "MEDIUM | RHEL-10-400140 | AUDIT | RHEL 10 must be configured so that world-writable directories are owned by root, sys, bin, or an application user."
      ansible.builtin.shell: |
        set -o pipefail
        df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -type d -perm -0002 -uid +999
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_worldwide_dir_owners.rc not in [ 0, 1 ]
      register: discovered_worldwide_dir_owners

    - name: "MEDIUM | RHEL-10-400140 | WARN | RHEL 10 must be configured so that world-writable directories are owned by root, sys, bin, or an application user."
      when: discovered_worldwide_dir_owners.stdout | length > 0
      ansible.builtin.debug:
        msg: |
             "Warning!! The following Directories do not match requirements for RHEL_09_232240
             {{ discovered_worldwide_dir_owners.stdout_lines }}"

    - name: "MEDIUM | RHEL-10-400140 | WARN | RHEL 10 must be configured so that world-writable directories are owned by root, sys, bin, or an application user."
      when: discovered_worldwide_dir_owners.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-400140"

- name: "MEDIUM | RHEL-10-400145 | PATCH | RHEL 10 must be configured so that all system device files are correctly labeled to prevent unauthorized modification."
  when: rhel10stig_400145
  tags:
    - RHEL-10-400145
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-281046r1165493_rule
    - V-281046
    - NIST800-53R4_AC-3
    - file_permissions
  block:
    - name: "MEDIUM | RHEL-10-400145 | AUDIT | RHEL 10 must be configured so that all system device files are correctly labeled to prevent unauthorized modification. | / scan"
      ansible.builtin.shell: |
        set -o pipefail
        find /dev \( -context *:unlabeled_t:* -o -context *:device_t:* \) \( -type c -o -type b \) -printf "%p %Z" | grep -v 'vmci'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_unlabelled_files.rc not in [ 0, 1 ]
      register: discovered_unlabelled_files

    - name: "MEDIUM | RHEL-10-400145 | AUDIT | RHEL 10 must be configured so that all system device files are correctly labeled to prevent unauthorized modification. | / scan"
      when:
        - discovered_unlabelled_files.stdout | length > 0
        - rhel10stig_disruption_high
      ansible.builtin.command: "restorecon -v {{ item }}"
      changed_when: true
      loop: "{{ discovered_unlabelled_files.stdout_lines }}"

    - name: "MEDIUM | RHEL-10-400145 | WARN | RHEL 10 must be configured so that all system device files are correctly labeled to prevent unauthorized modification."
      when:
        - discovered_unlabelled_files.stdout | length > 0
        - not rhel10stig_disruption_high
      ansible.builtin.debug:
        msg: "Warning!! Unlabelled device files found on the system {{ discovered_unlabelled_files }}"

    - name: "MEDIUM | RHEL-10-400145 | WARN | RHEL 10 must be configured so that all system device files are correctly labeled to prevent unauthorized modification."
      when:
        - discovered_unlabelled_files.stdout | length > 0
        - not rhel10stig_disruption_high
      ansible.builtin.import_tasks:
