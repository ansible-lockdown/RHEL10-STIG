    - RHEL-10-400230
    - CAT2
    - CCI-000381
    - SRG-OS-000095-GPOS-00049
    - SV-281063r1195403_rule
    - V-281063
    - NIST800-53R4_CM-6
    - file_permissions
  block:
    - name: "MEDIUM | RHEL-10-400230 | AUDIT | RHEL 10 must be configured to prohibit modification of permissions for cron configuration files and directories from the operating system defaults."
      ansible.builtin.shell: |
        set -o pipefail
        rpm --verify cronie crontabs | awk '! ($2 == "c" && $1 ~ /^.\..\.\.\.\..\./) {print $0}'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_cron_dirs_perms.rc not in [ 0, 1 ]
      register: discovered_cron_dirs_perms

    - name: "MEDIUM | RHEL-10-400230 | PATCH | RHEL 10 must be configured to prohibit modification of permissions for cron configuration files and directories from the operating system defaults."
      when: discovered_cron_dirs_perms.stdout | length > 0
      ansible.builtin.package:
        name:
          - cronie
          - crontabs
        state: absent

    - name: "MEDIUM | RHEL-10-400230 | PATCH | RHEL 10 must be configured to prohibit modification of permissions for cron configuration files and directories from the operating system defaults."
      when: discovered_cron_dirs_perms.stdout | length > 0
      ansible.builtin.package:
        name:
          - cronie
          - crontabs
        state: present

    - name: "MEDIUM | RHEL-10-400230 | PATCH | RHEL 10 must be configured to prohibit modification of permissions for cron configuration files and directories from the operating system defaults." # noqa: command-instead-of-module
      when: discovered_cron_dirs_perms.stdout | length > 0
      ansible.builtin.command: |
        rpm --setugids cronie crontabs
        rpm --setperms cronie crontabs
      changed_when: true

