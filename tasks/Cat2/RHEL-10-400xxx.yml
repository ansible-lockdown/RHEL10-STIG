- name: "MEDIUM | RHEL-10-400500 | PATCH | RHEL 10 must prohibit local initialization files from executing world-writable programs."
  when: rhel10stig_400500
  tags:
    - RHEL-10-400500
    - CAT2
    - CCI-000381
    - SRG-OS-000095-GPOS-00049
    - SV-281095r1184678_rule
    - V-281095
    - NIST800-53R4_CM-7
  block:
    - name: "MEDIUM | RHEL-10-400500 | PATCH | RHEL 10 must prohibit local initialization files from executing world-writable programs."
      ansible.builtin.command: find {{ rhel10stig_home_filesystem }} -perm -002 -type f -name ".[^.]*" -exec ls -ld {} \;
      changed_when: false
      failed_when: discovered_local_init_files_world_writable.rc not in [ 0, 1 ]
      register: discovered_local_init_files_world_writable

    - name: "MEDIUM | RHEL-10-400500 | PATCH | RHEL 10 must prohibit local initialization files from executing world-writable programs."
      when: discovered_local_init_files_world_writable.stdout | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'g-wx,o-rwx'
      loop: "{{ discovered_local_init_files_world_writable.stdout_lines }}"
