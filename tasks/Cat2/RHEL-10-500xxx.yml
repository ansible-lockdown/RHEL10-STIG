- name: "MEDIUM | RHEL-10-500215 | PATCH | RHEL 10 must log SSH connection attempts and failures to the server."
  when:
    - rhel10stig_500215
    - rhel10stig_sshd_required
  tags:
    - RHEL-10-500215
    - CAT2
    - CCI-000067
    - SRG-OS-000032-GPOS-00013
    - SV-257982r1045021_rule
    - V-257982
    - NIST800-53R4_AC-17
    - ssh
    - auditd
  notify: Restart sshd service
  block:
    - name: "MEDIUM | RHEL-10-500215 | PATCH | RHEL 10 must log SSH connection attempts and failures to the server. | Remove"
      when: "item.path != '/etc/ssh/sshd_config.d/50-stig-loglevel.conf'"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: (?i)(^LogLevel.*)
        replace: '#\1'
      loop: "{{ prelim_sshd_config_files.files }}"

    - name: "MEDIUM | RHEL-10-500215 | PATCH | RHEL 10 must log SSH connection attempts and failures to the server."
      ansible.builtin.template:
        src: "etc/ssh/sshd_config.d/50-stig-loglevel.conf.j2"
        dest: "/etc/ssh/sshd_config.d/50-stig-loglevel.conf"
        mode: 'go-rwx'
        group: root
        owner: root
        validate: sshd -t -f %s
      notify: Restart sshd service

