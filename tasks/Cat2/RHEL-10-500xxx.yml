- name: "MEDIUM | RHEL-10-500020 | PATCH | RHEL 10 must log username information when unsuccessful logon attempts occur."
  when:
    - rhel10stig_500020
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-500020
    - CAT2
    - CCI-000044
    - SRG-OS-000021-GPOS-00005
    - SV-281100r1165655_rule
    - V-281100
    - NIST800-53R4_AC-7
    - auditd
  block:
    - name: "MEDIUM | RHEL-10-500020 | PATCH | RHEL 10 must log username information when unsuccessful logon attempts occur."
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: ^(#?)\s*audit\s*=
        line: audit = yes

    - name: "MEDIUM | RHEL-10-500020 | AUDIT | RHEL 10 must log username information when unsuccessful logon attempts occur."
      ansible.builtin.shell: |
        set -o pipefail
        authselect current | grep with-faillock
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_authselect_faillock_state.rc not in [ 0, 1 ]
      register: discovered_authselect_faillock_state

    - name: "MEDIUM | RHEL-10-500020 | AUDIT | RHEL 10 must log username information when unsuccessful logon attempts occur."
      ansible.builtin.debug:
        msg: "discovered_authselect_faillock_state: {{ discovered_authselect_faillock_state }}"

    - name: "MEDIUM | RHEL-10-500020 | PATCH | RHEL 10 must log username information when unsuccessful logon attempts occur."
      when: "'with-faillock' not in discovered_authselect_faillock_state.stdout"
      ansible.builtin.command: authselect enable-feature with-faillock
      changed_when: true
      failed_when: discovered_authselect_faillock.rc not in [ 0, 1 ]
      register: discovered_authselect_faillock

- name: " MEDIUM | RHEL-10-500025 | PATCH | RHEL 10 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited."
  when:
    - rhel10stig_500025
    - rhel10stig_auditd_required
  tags:
    - RHEL-10-500025
    - CAT2
    - CCI-000171
    - SRG-OS-000063-GPOS-00032
    - SV-281101r1195411_rule
    - V-281101
    - NIST800-53R4_AU-12
    - auditd
  block:
    - name: "MEDIUM | RHEL-10-500025 | PATCH | RHEL 10 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited."
      ansible.builtin.find:
        paths: /etc/audit/rules.d/
        patterns: '*.rules'
        file_type: file
      changed_when: false
      register: discovered_audit_rules_mode

    - name: "MEDIUM | RHEL-10-500025 | PATCH | RHEL 10 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited."
      when: discovered_audit_rules_mode.matched > 0
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "{% if item.path == '/etc/audit/rules.d/audit.rules' %}u-x,go-rwx{% else %}u-x,g-wx,o-rwx{% endif %}"
      loop: "{{ discovered_audit_rules_mode.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: "MEDIUM | RHEL-10-500025 | PATCH | RHEL 10 must allow only the information system security manager (ISSM) (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited."
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: 'u-x,g-wx,o-rwx'
      register: discovered_audit_rules_changed
      failed_when: discovered_audit_rules_changed.state not in [ 'file', 'absent' ]
      loop:
        - { path: '/etc/audit/auditd.conf' }
        - { path: '/etc/audit/audit.rules' }

