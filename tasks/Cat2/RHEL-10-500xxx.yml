        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_grubby_audit_backlog_limit.rc not in [ 0, 1 ]
      register: discovered_grubby_audit_backlog_limit

    - name: "MEDIUM | RHEL-10-500030 | PATCH | RHEL 10 must allocate an 'audit_backlog_limit' of sufficient size to capture processes that start prior to the audit daemon."
      when: discovered_grubby_audit_backlog_limit.stdout | length == 0
      ansible.builtin.command: grubby --update-kernel=ALL --args="audit_backlog_limit={{ rhel10stig_audit_backlog_limit }}"
