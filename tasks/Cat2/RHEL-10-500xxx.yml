---

- name: "MEDIUM | RHEL-10-500000 | PATCH | RHEL 10 must enable the systemd-journald service."
  when: rhel10stig_500000
  tags:
    - RHEL-10-500000
    - CAT2
    - CCI-001665
    - SRG-OS-000269-GPOS-00103
    - SV-281096r1165643_rule
    - V-281096
    - NIST800-53R4_SC-24
    - journald
  notify: Systemd daemon reload
  ansible.builtin.systemd:
    name: systemd-journald
    enabled: true
    state: started

- name: "MEDIUM | RHEL-10-500005 | PATCH | RHEL 10 must enable auditing of processes that start prior to the audit daemon."
  when:
    - rhel10stig_500005
    - rhel10stig_auditd_required
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-500005
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-281097r1165646_rule
    - V-281097
    - NIST800-53R4_AC-3
    - auditd
  block:
    - name: "MEDIUM | RHEL-10-500005 | PATCH | RHEL 10 must enable auditing of processes that start prior to the audit daemon."
      ansible.builtin.shell: |
        set -o pipefail
        grubby --info=ALL | grep args | grep -v 'audit=1'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_grubby_audit_1.rc not in [ 0, 1 ]
      register: discovered_grubby_audit_1

    - name: "MEDIUM | RHEL-10-500005 | PATCH | RHEL 10 must enable auditing of processes that start prior to the audit daemon."
      when: discovered_grubby_audit_1.stdout | length > 0
      ansible.builtin.command: grubby --update-kernel=ALL --args="audit=1"
      changed_when: true

    - name: "MEDIUM | RHEL-10-500005 | PATCH | RHEL 10 must enable auditing of processes that start prior to the audit daemon."
      ansible.builtin.shell: |
        set -o pipefail
        grep "^GRUB_CMDLINE_LINUX=" /etc/default/grub | cut -f2 -d'"' | grep "audit=1"
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_def_grub_audit_1.rc not in [ 0, 1 ]
      register: discovered_def_grub_audit_1

    - name: "MEDIUM | RHEL-10-500005 | PATCH | RHEL 10 must enable auditing of processes that start prior to the audit daemon."
      when: discovered_def_grub_audit_1.rc != 0
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: ^(GRUB_CMDLINE_LINUX=")(.*)"
        line: '\1\2 audit=1"'
        backrefs: true

