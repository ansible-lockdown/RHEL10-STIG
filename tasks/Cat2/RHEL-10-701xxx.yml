          ansible.builtin.debug:
            msg: "WARNING!! A user Private key found without a password"

        - name: MEDIUM | RHEL-10-701240 | AUDIT | RHEL 10, for PKI-based authentication, must enforce authorized access to the corresponding private key.
          ansible.builtin.import_tasks:
