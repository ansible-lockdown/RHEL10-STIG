---

- name: "MEDIUM | RHEL-10-701000 | PATCH | RHEL 10 must clear the page allocator to prevent use-after-free attacks."
  when: rhel10stig_701000
  tags:
    - RHEL-10-701000
    - CAT2
    - CCI-001084
    - SRG-OS-000134-GPOS-00068
    - SV-257793r1044843_rule
    - V-257793
    - NIST800-53R4_SC-3
  block:
    - name: "MEDIUM | RHEL-10-701000 | AUDIT | RHEL 10 must clear the page allocator to prevent use-after-free attacks. | Capture grubby"
      ansible.builtin.shell: |
        set -o pipefail
        grubby --info=ALL | grep args | grep 'page_poison=1'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_grubby_page_alloc.rc not in [ 0, 1 ]
      register: discovered_grubby_page_alloc

    - name: "MEDIUM | RHEL-10-701000 | PATCH | RHEL 10 must clear the page allocator to prevent use-after-free attacks. | Amend grubby"
      when: discovered_grubby_page_alloc.stdout | length == 0
      ansible.builtin.command: grubby --update-kernel=ALL --args="page_poison=1"
      changed_when: true

    - name: "MEDIUM | RHEL-10-701000 | AUDIT | RHEL 10 must clear the page allocator to prevent use-after-free attacks. | Capture default grub"
      ansible.builtin.shell: |
        set -o pipefail
        grep "^GRUB_CMDLINE_LINUX=" /etc/default/grub | cut -f2 -d'"' | grep page_poison
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_def_grub_poison.rc not in [ 0 ,1 ]
      register: discovered_def_grub_poison

    - name: "MEDIUM | RHEL-10-701000 | PATCH | RHEL 10 must clear the page allocator to prevent use-after-free attacks. | Set default"
      when: discovered_def_grub_poison.rc != 0
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: ^(GRUB_CMDLINE_LINUX=")(.*)"
        line: '\1\2 page_poison=1"'
        backrefs: true
      notify: Rebuild grub

- name: "MEDIUM | RHEL-10-701010 | PATCH | RHEL 10 must clear memory when it is freed to prevent use-after-free attacks."
  when: rhel10stig_701010
