- name: "MEDIUM | RHEL-10-701190 | PATCH | RHEL 10 must implement nonexecutable data to protect its memory from unauthorized code execution."
  when: rhel10stig_701190
  tags:
    - RHEL-10-701190
    - CAT2
    - CCI-002824
    - SRG-OS-000433-GPOS-00192
    - SV-281321r1167113_rule
    - V-281321
    - NIST800-53R4_SI-16
  notify: Reboot required
  block:
    - name: "MEDIUM | RHEL-10-701190 | AUDIT | RHEL 10 must implement nonexecutable data to protect its memory from unauthorized code execution. | Capture default grub"
      ansible.builtin.shell: |
        set -o pipefail
        grep ^flags /proc/cpuinfo | grep -Ev '([^[:alnum:]])(nx)([^[:alnum:]]|$)'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_cpuinfo_nx.rc not in [ 0, 1 ]
      register: discovered_cpuinfo_nx

    - name: "MEDIUM | RHEL-10-701190 | AUDIT | RHEL 10 must implement nonexecutable data to protect its memory from unauthorized code execution. | Capture existence"
      when: discovered_cpuinfo_nx.stdout | length > 0
      ansible.builtin.shell: |
        set -o pipefail
        grubby --info=ALL | grep args | grep -E '([^[:alnum:]])(noexec)([^[:alnum:]])'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_grubby_noexec.rc not in [ 0, 1 ]
      register: discovered_grubby_noexec

    - name: "MEDIUM | RHEL-10-701190 | PATCH | RHEL 10 must implement nonexecutable data to protect its memory from unauthorized code execution. | Set default"
      when:
        - discovered_grubby_noexec.stdout is defined
        - discovered_grubby_noexec.stdout | length > 0
      ansible.builtin.command: grubby --update-kernel=ALL --args="noexec"
      changed_when: true

