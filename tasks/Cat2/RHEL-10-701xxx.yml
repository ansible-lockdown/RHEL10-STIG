    - name: "MEDIUM | RHEL-10-701010 | AUDIT | RHEL 10 must clear memory when it is freed to prevent use-after-free attacks. | Capture grubby"
      ansible.builtin.shell: |
        set -o pipefail
        grubby --info=ALL | grep args | grep 'init_on_free=1'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_grubby_slab.rc not in [ 0, 1 ]
      register: discovered_grubby_slab

    - name: "MEDIUM | RHEL-10-701010 | PATCH | RHEL 10 must clear memory when it is freed to prevent use-after-free attacks. | Amend grubby"
      when: discovered_grubby_slab.stdout | length == 0
      ansible.builtin.command: grubby --update-kernel=ALL --args="init_on_free=1"
      changed_when: true
      notify: Rebuild grub

    - name: "MEDIUM | RHEL-10-701010 | AUDIT | RHEL 10 must clear memory when it is freed to prevent use-after-free attacks. | Capture default grub"
      ansible.builtin.shell: |
        set -o pipefail
        grep "^GRUB_CMDLINE_LINUX=" /etc/default/grub | cut -f2 -d'"' | grep init_on_free
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_def_grub_slab.rc not in [ 0 ,1 ]
      register: discovered_def_grub_slab

    - name: "MEDIUM | RHEL-10-701010 | PATCH | RHEL 10 must clear memory when it is freed to prevent use-after-free attacks. | Set default"
      when: discovered_def_grub_slab.rc != 0
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: ^(GRUB_CMDLINE_LINUX=")(.*)"
        line: '\1\2 init_on_free=1"'
        backrefs: true
      notify: Rebuild grub

