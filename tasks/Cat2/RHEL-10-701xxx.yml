    - SRG-OS-000095-GPOS-00049
    - SV-281317r1167101_rule
    - V-281317
    - NIST800-53R4_CM-7
  ansible.builtin.lineinfile:
    path: /etc/systemd/coredump.conf
    regexp: ^(#?)ProcessSizeMax\s*=\s*(?!0)\d+
    line: ProcessSizeMax=0
    mode: 'u-x,go-wx'
    create: true

