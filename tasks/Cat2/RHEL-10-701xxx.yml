- name: "MEDIUM | RHEL-10-701270 | PATCH | RHEL 10 must, for PKI-based authentication, validate certificates by constructing a certification path (which includes status information) to an accepted trust anchor."
  when: rhel10stig_701270
  tags:
    - RHEL-10-701270
    - CAT2
    - CCI-000185
    - SRG-OS-000066-GPOS-00034
    - SRG-OS-000384-GPOS-00167
    - SV-281329r1195452_rule
    - V-281329
    - NIST800-53R4_IA-5
  block:
    - name: "MEDIUM | RHEL-10-701270 | AUDIT | RHEL 10 must, for PKI-based authentication, validate certificates by constructing a certification path (which includes status information) to an accepted trust anchor."
      ansible.builtin.shell: |
        set -o pipefail
        openssl x509 -text -in /etc/sssd/pki/sssd_auth_ca_db.pem | grep 'Issuer: C = US, O = U.S. Government, OU = DoD, OU = PKI, CN = DoD Root CA 3'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_dod_cert_check.rc not in [ 0 , 1 ]
      register: discovered_dod_cert_check

    - name: "MEDIUM | RHEL-10-701270 | WARN | RHEL 10 must, for PKI-based authentication, validate certificates by constructing a certification path (which includes status information) to an accepted trust anchor."
      when: discovered_dod_cert_check is defined
      ansible.builtin.debug:
        msg: "Warning!! Please Investigate - Not a DOD issued ssl certificate "

    - name: "MEDIUM | RHEL-10-701270 | WARN | RHEL 10 must, for PKI-based authentication, validate certificates by constructing a certification path (which includes status information) to an accepted trust anchor."
      when: discovered_dod_cert_check is defined
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-701270"

