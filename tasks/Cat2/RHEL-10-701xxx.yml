- name: "MEDIUM | RHEL-10-701220 | PATCH | RHEL 10 must enable certificate based smart card authentication."
  when:
    - rhel10stig_701220
    - rhel10stig_disruption_high
    - prelim_sssd_installed
    - rhel10stig_smartcard_reader
  tags:
    - RHEL-10-701220
    - CAT2
    - CCI-000765
    - CCI-000766
    - SRG-OS-000105-GPOS-00052
    - SRG-OS-000106-GPOS-00053
    - SRG-OS-000107-GPOS-00054
    - SRG-OS-000108-GPOS-00055
    - SRG-OS-000375-GPOS-00160
    - SV-281324r1167122_rule
    - V-281324
    - NIST800-53R4_IA-5
  community.general.ini_file:
    path: /etc/sssd/conf.d/stig.conf
    option: pam_cert_auth
    section: 'sssd'
    value: true
    create: true
    mode: 'u-x,go-wx'
    owner: root
    group: root
  notify: Restart sssd

- name: "MEDIUM | RHEL-10-701230 | PATCH | RHEL 10 must implement certificate status checking for multifactor authentication."
  when:
    - rhel10stig_701230
    - rhel10stig_disruption_high
    - prelim_sssd_installed
  tags:
    - RHEL-10-701230
    - CAT2
    - CCI-001954
    - SRG-OS-000375-GPOS-00160
    - SRG-OS-000377-GPOS-00162
    - SRG-OS-000705-GPOS-00150
    - SV-281325r1184772_rule
    - V-281325
    - NIST800-53R4_IA-2
  notify: Restart sssd
  block:
    - name: "MEDIUM | RHEL-10-701230 | AUDIT | RHEL 10 must implement certificate status checking for multifactor authentication. | Capture existence"
      ansible.builtin.shell: |
        set -o pipefail
        grep certificate_verification /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf | grep -v "^#"
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_sssd_cert_verification_files.rc not in [ 0, 1, 2 ]
      register: discovered_sssd_cert_verification_files

    - name: "MEDIUM | RHEL-10-701230 | PATCH | RHEL 10 must implement certificate status checking for multifactor authentication. | Add if missing"
      when:
        - discovered_sssd_cert_verification_files.stdout | length > 0
        - "item not /etc/sssd/conf.d/certificate_verification.conf"
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: ^((#|)certificate_verification =.*)
        line: '#\1'
        backrefs: true
      loop: "{{ discovered_sssd_cert_verification_files.stdout_lines }}"

    - name: "MEDIUM | RHEL-10-701230 | PATCH | RHEL 10 must implement certificate status checking for multifactor authentication. | Add if missing"
      when: discovered_sssd_cert_verification_files.stdout | length == 0
      community.general.ini_file:
        path: /etc/sssd/conf.d/certificate_verification.conf
        section: 'sssd'
        value: 'ocsp_dgst=sha512'
        option: certificate_verification
        group: root
        owner: root
        mode: 'u-x,go-rwx'
        create: true

- name: "MEDIUM | RHEL-10-701240 | PATCH | RHEL 10 must, for PKI-based authentication, enforce authorized access to the corresponding private key."
  when: rhel10stig_701240
  tags:
    - RHEL-10-701240
    - CAT2
    - CCI-000186
    - SRG-OS-000067-GPOS-00035
    - SV-281326r1184637_rule
    - V-281326
    - NIST800-53R4_IA-2
  block:
    - name: MEDIUM | RHEL-10-701240 | AUDIT | RHEL 10 must, for PKI-based authentication, enforce authorized access to the corresponding private key.
      ansible.builtin.find:
        paths: /home/*/.ssh
        patterns: .*(!?\..*)
      register: discovered_private_ssh_keys

    - name: MEDIUM | RHEL-10-701240 | AUDIT | RHEL 10 must, for PKI-based authentication, enforce authorized access to the corresponding private key.
      ansible.builtin.command: ssh-keygen -y -P "" -f {{ item.path }}
      changed_when: false
      failed_when: false
      loop: "{{ discovered_private_ssh_keys.files }}"
      register: discovered_ssh_private_passwd_check

    - name: MEDIUM | RHEL-10-701240 | AUDIT | RHEL 10 must, for PKI-based authentication, enforce authorized access to the corresponding private key.
      when: discovered_ssh_private_passwd_check.stdout is defined
      block:
