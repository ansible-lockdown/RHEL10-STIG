- name: "MEDIUM | RHEL-10-200562 | PATCH | RHEL 10 must block unauthorized peripherals before establishing a connection."
  when:
    - rhel10stig_200562
    - rhel10stig_disruption_high  # If configuring locally could stop peripherals from working.
  tags:
    - RHEL-10-200562
    - CAT2
    - CCI-001958
    - SRG-OS-000378-GPOS-00163
    - SV-280964r1165247_rule
    - V-280964
    - NIST800-53R4_IA-3
    - usbguard
  block:
    - name: "MEDIUM | RHEL-10-200562 | AUDIT | RHEL 10 must block unauthorized peripherals before establishing a connection."
      ansible.builtin.shell: |
        set -o pipefail
        usbguard list-rules | wc -l
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_usbguard_rules.rc not in [ 0, 1 ]
      register: discovered_usbguard_rules

    - name: "MEDIUM | RHEL-10-200562 | PATCH | RHEL 10 must block unauthorized peripherals before establishing a connection."
      when: discovered_usbguard_rules.stdout | int > 0
      ansible.builtin.shell: |
        set -o pipefail
        usbguard generate-policy --no-hash > /etc/usbguard/rules.conf
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: true
      notify: Restart usbguard

- name: "MEDIUM | RHEL-10-200563 | PATCH | RHEL 10 must enable audit logging for the USBGuard daemon."
