- name: "MEDIUM | RHEL-10-200602 | PATCH | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs."
  when:
    - rhel10stig_200602
    - rhel10stig_disruption_high
    - rhel10stig_allow_fapolicy_updates
  tags:
    - RHEL-10-200602
    - CAT2
    - CCI-001764
    - CCI-001774
    - SRG-OS-000370-GPOS-00155
    - SRG-OS-000368-GPOS-00154
    - SV-280971r1184780_rule
    - V-280971
    - NIST800-53R4_CM-7
    - fapolicyd
  block:
    - name: "MEDIUM | RHEL-10-200602 | AUDIT | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. | capture fapolicy state"
      ansible.builtin.shell: |
        set -o pipefail
        fapolicyd-cli --check-config && fagenrules --check
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_fapolicy_rules_state.rc not in [ 0, 1 ]
      register: discovered_fapolicy_rules_state

    - name: "MEDIUM | RHEL-10-200602 | WARN | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. | Warning"
      when: discovered_fapolicy_rules_state.rc != 0
      ansible.builtin.debug:
        msg: "Warning!! Fapolicy not clean please run: fapolicyd-cli --check-config && fagenrules --check"

    - name: "MEDIUM | RHEL-10-600470 | WARN | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. | Warning count"
      when: discovered_fapolicy_rules_state.rc != 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-200602"

    - name: "MEDIUM | RHEL-10-200602 | AUDIT | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs."
      when:
        - "'No change' in discovered_fapolicy_rules_state.stdout"
        - rhel10stig_disruption_high
        - rhel10stig_allow_fapolicy_updates
      block:
        - name: "MEDIUM | RHEL-10-200602 | AUDIT | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. | capture fapolicy state"
          ansible.builtin.template:
            src: etc/fapolicyd/rules.d/99-stig-whitelist.rules.j2
            dest: /etc/fapolicyd/rules.d/99-stig-whitelist.rules
            mode: 'go-wx'
            owner: root
            group: fapolicyd

        - name: "MEDIUM | RHEL-10-200602 | AUDIT | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. | capture current permissive"
          ansible.builtin.command: grep -E ^permissive /etc/fapolicyd/fapolicyd.conf
          changed_when: false
          register: discovered_fapolicy_permissive_state

        - name: "MEDIUM | RHEL-10-200602 | PATCH | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. | set permissive"
          when: "'permissive = 1' in discovered_fapolicy_permissive_state.stdout"
          ansible.builtin.replace:
            path: /etc/fapolicyd/fapolicyd.conf
            regexp: ^permissive\s*=\s*1
            replace: permissive = 0
          notify: Restart fapolicyd

        - name: "MEDIUM | RHEL-10-200602 | PATCH | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. | reload fapolicyd"
          when: "'permissive = 1' in discovered_fapolicy_permissive_state.stdout"
          ansible.builtin.systemd:
            name: fapolicyd
            state: restarted

        - name: "MEDIUM | RHEL-10-200602 | AUDIT | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. | capture rules"
          ansible.builtin.shell: |
            set -o pipefail
            grep -E "^deny" /etc/fapolicyd/rules.d/*.rules
          args:
            executable: "{{ rhel10stig_shell_executable }}"
          changed_when: false
          failed_when: discovered_fapolicy_compiled_rules.rc not in [ 0, 1, 2 ]
          register: discovered_fapolicy_compiled_rules

        - name: "MEDIUM | RHEL-10-200602 | PATCH | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. | Add deny rules"
          when: "'99_stig_deny_all.rules:deny perm=any all : all' not in discovered_fapolicy_compiled_rules.stdout"
          ansible.builtin.lineinfile:
            path: /etc/fapolicyd/rules.d/99_stig_deny_all.rules
            regexp: 'deny perm=any all : all'
            line: 'deny perm=any all : all'
            create: true
            owner: root
            group: fapolicyd
            mode: 'go-wx'
          register: discovered_deny_rule_added

        - name: "MEDIUM | RHEL-10-200602 | PATCH | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. | Reload rules"
          when: discovered_deny_rule_added.changed  # noqa no-handler
          ansible.builtin.command: fapolicyd-cli --reload-rules
          changed_when: true
          notify: Restart fapolicyd

        - name: "MEDIUM | RHEL-10-200602 | AUDIT | The RHEL 10 fapolicy module must be configured to employ a deny-all, permit-by-exception policy to allow the execution of authorized software programs. | Check rules ok"
          ansible.builtin.shell: |
            set -o pipefail
            fagenrules --check && fapolicyd-cli --check-config
          args:
            executable: "{{ rhel10stig_shell_executable }}"
          changed_when: false
          failed_when:
            - "'should be updated' in discovered_fapolicy_rule_addition_check.stdout"
            - "'Daemon config is OK' not in discovered_fapolicy_rule_addition_check.stdout"
          register: discovered_fapolicy_rule_addition_check

