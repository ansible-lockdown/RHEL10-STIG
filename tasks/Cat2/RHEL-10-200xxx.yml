  notify: Restart rsyslog
  block:
    - name: "MEDIUM | RHEL-10-200644 | AUDIT | RHEL 10 must authenticate the remote logging server for offloading audit logs via rsyslog."
      ansible.builtin.shell: |
        set -o pipefail
        grep -rE 'streamdriver.authmode|streamdriver.permittedpeer|tls.authmode|tls.permittedpeer' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
      args:
        executable: "{{ rhel10stig_shell_executable }}"
