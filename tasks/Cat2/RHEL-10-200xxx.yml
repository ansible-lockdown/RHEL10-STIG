    - name: "MEDIUM | RHEL-10-200644 | PATCH | RHEL 10 must authenticate the remote logging server for offloading audit logs via rsyslog."
      when:
        - rhel10stig_disruption_high
        - discovered_rsyslog_remote_auth_x509 is defined
        - "'x509' not in discovered_rsyslog_remote_auth_x509.stdout"
        - not rhel10stig_rsyslog_legacy_offload
      ansible.builtin.template:
        src: etc/rsyslog.d/99-forwarding.conf.j2
        dest: /etc/rsyslog.d/99-forwarding.conf
        mode: 'u-x,go-wx'
        owner: root
        group: root

