  when: rhel10stig_200000
  notify: Reboot required
  tags:
    - RHEL-10-200000
    - CAT2
    - CCI-002617
    - SRG-OS-000437-GPOS-00194
    - SV-280942r1165181_rule
    - V-280942
    - NIST800-53R4_SI-2
    - dnf
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: ^(#?)\s*clean_requirements_on_remove.*
