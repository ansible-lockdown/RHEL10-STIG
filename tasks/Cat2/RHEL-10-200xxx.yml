- name: "MEDIUM | RHEL-10-200532 | PATCH | A RHEL 10 firewall must employ a deny-all, allow-by-exception policy for allowing connections to other systems."
  when: rhel10stig_200532
  tags:
    - RHEL-10-200532
    - CAT2
    - CCI-002314
    - SRG-OS-000297-GPOS-00115
    - SV-280957r1165226_rule
    - V-280957
    - NIST800-53R4_CM-7
  notify: Reload firewalld
  block:
    - name: "MEDIUM | RHEL-10-200532 | PATCH | A RHEL 10 firewall must employ a deny-all, allow-by-exception policy for allowing connections to other systems. | Setup Connections"
      ansible.posix.firewalld:
        zone: "{{ rhel10stig_custom_firewall_zone }}"
        permanent: true
        state: enabled
        service: "{{ item.name }}"
        port: "{{ item.port | default(omit) }}"
        protocol: "{{ item.protocol | default(omit) }}"
      loop: "{{ rhel10stig_white_list_services }}"

    - name: "MEDIUM | RHEL-10-200532 | PATCH | A RHEL 10 firewall must employ a deny-all, allow-by-exception policy for allowing connections to other systems."
      ansible.posix.firewalld:
        zone: "{{ rhel10stig_custom_firewall_zone }}"
        permanent: true
        state: enabled
        target: DROP
      register: discovered_firewalld_target

    - name: "MEDIUM | RHEL-10-200532 | PATCH | A RHEL 10 firewall must employ a deny-all, allow-by-exception policy for allowing connections to other systems. | Reload zones"
      when: discovered_firewalld_target.changed  # noqa no-handler
      ansible.builtin.command: firewall-cmd --reload
      changed_when: discovered_firewalld_reload.rc == 0
      failed_when: discovered_firewalld_reload.rc >= 2
      register: discovered_firewalld_reload

    - name: "MEDIUM | RHEL-10-200532 | PATCH | A RHEL 10 firewall must employ a deny-all, allow-by-exception policy for allowing connections to other systems. | Setup Connections"
      ansible.posix.firewalld:
        zone: "{{ rhel10stig_custom_firewall_zone }}"
        permanent: true
        state: enabled
        interface: "{{ rhel10stig_custom_firewall_interface | join(',') }}"

    - name: "MEDIUM | RHEL-10-200532 | AUDIT | A RHEL 10 firewall must employ a deny-all, allow-by-exception policy for allowing connections to other systems. | Get default zone"
      ansible.builtin.command: "firewall-cmd --get-default-zone"
      changed_when: false
      failed_when: discovered_current_firewalld_zone.rc not in [ 0, 1 ]
      register: discovered_current_firewalld_zone

    - name: "MEDIUM | RHEL-10-200532 | PATCH | A RHEL 10 firewall must employ a deny-all, allow-by-exception policy for allowing connections to other systems. | Set zone if not current"
      when: "(discovered_current_firewalld_zone.stdout | default([])) not in rhel10stig_custom_firewall_zone"
      ansible.builtin.command: "firewall-cmd --set-default-zone={{ rhel10stig_custom_firewall_zone }}"
      changed_when: true

    - name: "MEDIUM | RHEL-10-200532 | PATCH | A RHEL 10 firewall must employ a deny-all, allow-by-exception policy for allowing connections to other systems. | Reload firewall"
      when: "(discovered_current_firewalld_zone.stdout | default([])) not in rhel10stig_custom_firewall_zone"
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true

