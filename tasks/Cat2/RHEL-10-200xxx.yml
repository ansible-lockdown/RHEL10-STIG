- name: "MEDIUM | RHEL-10-200692 | PATCH | RHEL 10 must be configured to prevent unrestricted mail relaying."
  when:
    - rhel10stig_200692
    - "'postfix' in ansible_facts['packages']"
  tags:
    - RHEL-10-200692
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-257951r1014843_rule
    - V-257951
    - NIST800-53R4_CM-6
  block:
    - name: "MEDIUM | RHEL-10-200692 | AUDIT | RHEL 10 must be configured to prevent unrestricted mail relaying."
      ansible.builtin.shell: |
        set -o pipefail
        postconf -n smtpd_client_restrictions | awk -F ' ' '{print $3}'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_postfix_client_restrict.rc not in [ 0, 1 ]
      register: discovered_postfix_client_restrict

    - name: "MEDIUM | RHEL-10-200692 | PATCH | RHEL 10 must be configured to prevent unrestricted mail relaying. | configure postfix"
      when:
        - rhel10stig_disruption_high
        - (discovered_postfix_client_restrict.stdout | length == 0 or
          rhel10stig_postfix_client_conf not in discovered_postfix_client_restrict.stdout)
      ansible.builtin.command: "postconf -e 'smtpd_client_restrictions = {{ rhel10stig_postfix_client_conf }}'"
      changed_when: true

    - name: "MEDIUM | RHEL-10-200692 | PATCH | RHEL 10 must be configured to prevent unrestricted mail relaying. | Alert Warning"
      when:
        - not rhel10stig_disruption_high
        - discovered_postfix_client_restrict.stdout | length == 0
      ansible.builtin.debug:
        msg: "Warning!! Please check postfix client restriction configurations"

    - name: "MEDIUM | RHEL-10-200692 | PATCH | RHEL 10 must be configured to prevent unrestricted mail relaying. | Warning Count"
      when:
        - not rhel10stig_disruption_high
        - discovered_postfix_client_restrict.stdout | length == 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-200692"

