    - not rhel10stig_rsyslog_server
  tags:
    - RHEL-10-200643
    - CAT2
    - CCI-002385
    - SRG-OS-000420-GPOS-00186
    - SV-280986r1184782_rule
    - V-280986
    - NIST800-53R4_SC-5
    - rsyslog
  notify: Restart rsyslog
  block:
    - name: "MEDIUM | RHEL-10-200643 | AUDIT | RHEL 10 must be configured so that the rsyslog daemon does not accept log messages from other servers unless the server is being used for log aggregation."
      ansible.builtin.find:
        paths: /etc/rsyslog.d/
      register: discovered_rsyslog_conf

    - name: "MEDIUM | RHEL-10-200643 | PATCH | RHEL 10 must be configured so that the rsyslog daemon does not accept log messages from other servers unless the server is being used for log aggregation."
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.conf
        regex: ^(?!#)(InputTCPServerRun|UDPServerRun|RELPServerRun|imtcp|imudp|imrelp)(.*)
        line: '#\1\2\3'
        backrefs: true

    - name: "MEDIUM | RHEL-10-200643 | PATCH | RHEL 10 must be configured so that the rsyslog daemon does not accept log messages from other servers unless the server is being used for log aggregation."
      when: discovered_rsyslog_conf.matched > 1
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regex: (?!#)(InputTCPServerRun|UDPServerRun|RELPServerRun|imtcp|imudp|imrelp)(.*)
        line: '#\1\2\3'
        backrefs: true
      loop: "{{ discovered_rsyslog_conf.files }}"

