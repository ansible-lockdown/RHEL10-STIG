      changed_when: false

    - name: "MEDIUM | RHEL-10-800010 | PATCH | RHEL 10 must be configured to prohibit or restrict the use of functions, ports, protocols, and/or services, as defined in the Ports, Protocols, and Services Management (PPSM) Category Assignments List (CAL) and vulnerability assessments. | Add firewall rules"
