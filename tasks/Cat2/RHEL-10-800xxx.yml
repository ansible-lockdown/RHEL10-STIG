- name: "MEDIUM | RHEL-10-800310 | PATCH | RHEL 10 must be configured to operate in secure mode if the Trivial File Transfer Protocol (TFTP) server service is required."
  when:
    - rhel10stig_800310
    - "'tftp' in ansible_facts['packages']"
  tags:
    - RHEL-10-800310
    - CAT2
    - CCI-000197
    - SRG-OS-000074-GPOS-00042
    - SV-281363r1195454_rule
    - V-281363
    - NIST800-53R4_IA-5
    - tftp
  block:
    - name: "MEDIUM | RHEL-10-800310 | PATCH | RHEL 10 must be configured to operate in secure mode if the Trivial File Transfer Protocol (TFTP) server service is required. | systemd drop-in directory"
      ansible.builtin.file:
        path: /etc/systemd/system/tftp.service.d
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: "MEDIUM | RHEL-10-800310 | PATCH | RHEL 10 must be configured to operate in secure mode if the Trivial File Transfer Protocol (TFTP) server service is required. | systemd override for secure tftpd"
      ansible.builtin.copy:
        dest: /etc/systemd/system/tftp.service.d/secure.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/sbin/in.tftpd -s /var/lib/tftpboot
        mode: '0644'
        owner: root
        group: root
      register: discovered_tftp_secure_override

    - name: "MEDIUM | RHEL-10-800310 | PATCH | RHEL 10 must be configured to operate in secure mode if the Trivial File Transfer Protocol (TFTP) server service is required. | Reload systemd and restart tftpd"
      when: discovered_tftp_secure_override.changed  # noqa: no-handler
      ansible.builtin.systemd:
        name: tftp.service
        state: restarted
