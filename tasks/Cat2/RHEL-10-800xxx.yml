---

- name: "MEDIUM | RHEL-10-800000 | AUDIT | RHEL 10 must control remote access methods."
  when: rhel10stig_800000
  tags:
    - RHEL-10-800000
    - CAT2
    - CCI-000382
    - CCI-002314
    - SRG-OS-000096-GPOS-00050
    - SRG-OS-000297-GPOS-00115
    - SV-281332r1167146_rule
    - V-281332
    - NIST800-53R4_CM-7
    - firewalld
  block:
    - name: "MEDIUM | RHEL-10-800000 | AUDIT | RHEL 10 must control remote access methods. | Add firewall rules"
      ansible.posix.firewalld:
        zone: "{{ rhel10stig_custom_firewall_zone }}"
        permanent: true
        state: enabled
        service: "{{ item.name }}"
        port: "{{ item.port | default(omit) }}"
        protocol: "{{ item.protocol | default(omit) }}"
      loop: "{{ rhel10stig_white_list_services }}"
      notify: Reload firewalld

    - name: "MEDIUM | RHEL-10-800000 | AUDIT | RHEL 10 must control remote access methods. | List firewalld configuration"
      ansible.builtin.command: firewall-cmd --list-all
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_rhel10stig_firewalld_list_all

    - name: "MEDIUM | RHEL-10-800000 | AUDIT | RHEL 10 must control remote access methods. | Display configuration for ISSO PPSM CLSA validation"
      when: discovered_rhel10stig_firewalld_list_all.stdout_lines is defined
      ansible.builtin.debug:
        msg:
          - "Review the following firewalld configuration against the site PPSM CLSA. Unapproved ports, protocols, or services are a finding."
          - "{{ discovered_rhel10stig_firewalld_list_all.stdout_lines }}"
      changed_when: false

    - name: "MEDIUM | RHEL-10-800000 | PATCH | RHEL 10 must control remote access methods. | Include warning tasks"
      when: discovered_rhel10stig_firewalld_list_all.stdout_lines is defined
      ansible.builtin.include_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-800000"

