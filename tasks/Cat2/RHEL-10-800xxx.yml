- name: "MEDIUM | RHEL-10-800020 | AUDIT | RHEL 10 must enforce that network interfaces not be in promiscuous mode."
  when: rhel10stig_800020
  tags:
    - RHEL-10-800020
    - CAT2
    - CCI-002418
    - SRG-OS-000423-GPOS-00187
    - SV-281334r1167152_rule
    - V-281334
    - NIST800-53R4_CM-5
    - network
  block:
    - name: "MEDIUM | RHEL-10-800020 | PATCH | RHEL 10 must enforce that network interfaces not be in promiscuous mode."
      ansible.builtin.shell: |
        set -o pipefail
        ip link | grep -Ei '^[0-9]*promisc' | cut -d ':' -f2
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: false
      register: discovered_ip_link_promisc

    - name: "MEDIUM | RHEL-10-800020 | PATCH | RHEL 10 must enforce that network interfaces not be in promiscuous mode. | Set interface to promiscuous mode"
      when:
        - discovered_ip_link_promisc is defined and discovered_ip_link_promisc.stdout | length > 0
        - "item not in rhel10stig_promisc_if"
        - rhel10stig_disruption_high
      ansible.builtin.command: ip link set dev {{ item }} promisc off
      changed_when: true
      loop: "{{ discovered_ip_link_promisc.stdout_lines }}"
      notify: Restart NetworkManager

    - name: "MEDIUM | RHEL-10-800020 | PATCH | RHEL 10 must enforce that network interfaces not be in promiscuous mode. | Alert Warning"
      when:
        - discovered_ip_link_promisc is defined and discovered_ip_link_promisc.stdout | length > 0
        - not rhel10stig_disruption_high
      ansible.builtin.debug:
        msg: "Warning!! You have interfaces set to promiscuous mode {{ discovered_ip_link_promisc.stdout_lines }}"

    - name: "MEDIUM | RHEL-10-800020 | PATCH | RHEL 10 must enforce that network interfaces not be in promiscuous mode. | Include warning tasks"
      when:
        - discovered_ip_link_promisc is defined and discovered_ip_link_promisc.stdout | length > 0
        - not rhel10stig_disruption_high
      ansible.builtin.include_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-800020"

