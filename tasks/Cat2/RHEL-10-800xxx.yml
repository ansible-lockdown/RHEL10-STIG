- name: "MEDIUM | RHEL-10-800060 | PATCH | RHEL 10 must have at least two name servers configured for systems using Domain Name Server (DNS) resolution."
  when: rhel10stig_800060
  tags:
    - RHEL-10-800060
    - CAT2
    - CCI-002385
    - SRG-OS-000420-GPOS-00186
    - SV-281338r1167164_rule
    - V-281338
    - NIST800-53R4_SC-5
    - network
    - dns
  block:
    - name: "MEDIUM | RHEL-10-800060 | AUDIT | RHEL 10 must have at least two name servers configured for systems using Domain Name Server (DNS) resolution. | Count number of name servers in resolv.conf"
      ansible.builtin.shell: |
        set -o pipefail
        grep -Ei '^nameserver[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' /etc/resolv.conf | wc -l
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: false
      register: discovered_resolv_conf_nameservers_count

    - name: "MEDIUM | RHEL-10-800060 | PATCH | RHEL 10 must have at least two name servers configured for systems using Domain Name Server (DNS) resolution. | Alert Warning"
      when: discovered_resolv_conf_nameservers_count.stdout | int < 2
      ansible.builtin.debug:
        msg: "Warning!! You have less than two name servers configured in resolv.conf"

    - name: "MEDIUM | RHEL-10-800060 | PATCH | RHEL 10 must have at least two name servers configured for systems using Domain Name Server (DNS) resolution. | Include warning tasks"
      when: discovered_resolv_conf_nameservers_count.stdout | int < 2
      ansible.builtin.include_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-800060"

- name: "MEDIUM | RHEL-10-800070 | AUDIT | RHEL 10 must not have unauthorized IP tunnels configured."
  when:
    - rhel10stig_800070
    - "'ipsec' in ansible_facts['packages']"
  tags:
    - RHEL-10-800070
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-281339r1167167_rule
    - V-281339
    - NIST800-53R4_AC-3
    - ipsec
    - network
  block:
    - name: "MEDIUM | RHEL-10-800070 | AUDIT | RHEL 10 must not have unauthorized IP tunnels configured. | check ipsec connections"
      ansible.builtin.shell: |
        set -o pipefail
        systemctl status ipsec | grep ": active" > /dev/null && grep -rni conn /etc/ipsec.conf /etc/ipsec.d/
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_ipsec_connections.rc not in [ 0, 1, 2]
      register: discovered_ipsec_connections

    - name: "MEDIUM | RHEL-10-800070 | WARN | RHEL 10 must not have unauthorized IP tunnels configured. | Alert Warning"
      when: discovered_ipsec_connections.stdout | length > 0
      ansible.builtin.debug:
        msg: |
          "Warning!! The following Ipsec tunnels have been discovered please confirm with ISSO these are accepted and documented
          {{ discovered_ipsec_connections.stdout_lines }}"

    - name: "MEDIUM | RHEL-10-800070 | WARN | RHEL 10 must not have unauthorized IP tunnels configured. | Warning Count"
      when: discovered_ipsec_connections.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-800070"

