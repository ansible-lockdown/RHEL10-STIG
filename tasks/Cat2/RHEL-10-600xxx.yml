- name: "MEDIUM | RHEL-10-600250 | PATCH | RHEL 10 must enforce password complexity by requiring that at least one uppercase character be used."
  when:
    - rhel10stig_600250
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-600250
    - CAT2
    - CCI-NA
    - SRG-OS-000069-GPOS-00037
    - SV-281184r1197239_rule
    - V-281184
    - NIST800-53R4_NA
    - login
