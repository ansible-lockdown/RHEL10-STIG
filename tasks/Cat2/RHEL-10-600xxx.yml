- name: "MEDIUM | RHEL-10-600540 | PATCH | RHEL 10 must require reauthentication when using the 'sudo' command."
  when: rhel10stig_600540
  tags:
    - RHEL-10-600540
    - CAT2
    - CCI-002038
    - SRG-OS-000373-GPOS-00156
    - SRG-OS-000373-GPOS-00157
    - SRG-OS-000373-GPOS-00158
    - SV-281209r1166579_rule
    - V-281209
    - NIST800-53R4_IA-11
    - sudo
    - privilege_escalation
  block:
    - name: "MEDIUM | RHEL-10-600540 | PATCH | RHEL 10 must require reauthentication when using the 'sudo' command."
      ansible.builtin.shell: |
        set -o pipefail
        grep -i 'timestamp_timeout' /etc/sudoers /etc/sudoers.d/*
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_sudoers_timestamp_timeout_conf_files.rc not in [ 0, 1, 2 ]
      register: discovered_sudoers_timestamp_timeout_conf_files

    - name: "MEDIUM | RHEL-10-600540 | PATCH | RHEL 10 must require reauthentication when using the 'sudo' command."
      when: rhel10stig_disruption_high
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: ^Defaults timestamp_timeout\s*=\s*\d(.*)
        line: Defaults timestamp_timeout=0
        insertafter: '^# Defaults specification'
        state: present
        validate: '/usr/sbin/visudo -cf %s'

- name: "MEDIUM | RHEL-10-600550 | PATCH | RHEL 10 must use the invoking user's password for privilege escalation when using 'sudo'."
  when: rhel10stig_600550
  tags:
    - RHEL-10-600550
    - CAT2
    - CCI-002038
    - SRG-OS-000373-GPOS-00156
    - SV-281210r1166582_rule
    - V-281210
    - NIST800-53R4_IA-11
    - sudo
    - privilege_escalation
  block:
    - name: "MEDIUM | RHEL-10-600550 | AUDIT | RHEL 10 must use the invoking user's password for privilege escalation when using 'sudo'. | targetpw"
      ansible.builtin.shell: |
        set -o pipefail
        grep -Ei '(!targetpw|!rootpw|!runaspw)' /etc/sudoers /etc/sudoers.d/*
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_sudoers_defaults_config.rc not in [ 0, 1, 2 ]
      register: discovered_sudoers_defaults_config

    - name: "MEDIUM | RHEL-10-600550 | PATCH | RHEL 10 must use the invoking user's password for privilege escalation when using 'sudo'. | targetpw"
      when:
        - rhel10stig_disruption_high
        - "item not in discovered_sudoers_defaults_config.stdout"
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: ^Defaults (.*){{ item }}(.*)
        line: "Defaults {{ item }}"
        insertafter: '^# Defaults specification'
        validate: '/usr/sbin/visudo -cf %s'
      loop:
        - '!targetpw'
        - '!rootpw'
        - '!runaspw'

- name: "MEDIUM | RHEL-10-600600 | PATCH | RHEL 10 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file."
  when:
    - rhel10stig_600600
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-600600
    - CAT2
    - CCI-000044
    - SRG-OS-000021-GPOS-00005
    - SV-258095r1045189_rule
    - V-258095
    - NIST800-53R4_AC-7
    - pam
  notify: Restart sssd
  block:
    - name: "MEDIUM | RHEL-10-600600 | AUDIT | RHEL 10 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file."
      when: rhel10stig_uses_authselect
      ansible.builtin.shell: |
        set -o pipefail
        authselect current | grep with-faillock
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: false
      register: discovered_enabled_authselect_faillock_state

    - name: "MEDIUM | RHEL-10-600600 | AUDIT | RHEL 10 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file."
      when:
        - rhel10stig_uses_authselect
        - "'with-faillock' not in discovered_enabled_authselect_faillock_state.stdout"
      ansible.builtin.command: authselect enable-feature with-faillock
      changed_when: false
      failed_when: false

    - name: "MEDIUM | RHEL-10-600600 | PATCH | RHEL 10 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file."
      when: not rhel10stig_uses_authselect
      block:
        - name: "MEDIUM | RHEL-10-600600 | PATCH | RHEL 10 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file. | Set preauth"
          community.general.pamd:
            name: system-auth
            type: auth
            control: required
            module_path: pam_env.so
            state: after
            new_type: auth
            new_control: required
            new_module_path: pam_faillock.so
            module_arguments: 'preauth'

        - name: "MEDIUM | RHEL-10-600600 | PATCH | RHEL 10 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file. | Set authfail"
          community.general.pamd:
            name: system-auth
            type: auth
            control: required
            module_path: pam_deny.so
            state: before
            new_type: auth
            new_control: required
            new_module_path: pam_faillock.so
            module_arguments: 'authfail'

        - name: "MEDIUM | RHEL-10-600600 | PATCH | RHEL 10 must configure the use of the pam_faillock.so module in the /etc/pam.d/system-auth file. | Set account faillock"
          community.general.pamd:
            name: system-auth
            type: account
            control: required
            module_path: pam_unix.so
            state: before
            new_type: account
            new_control: required
            new_module_path: pam_faillock.so

