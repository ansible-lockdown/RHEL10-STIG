- name: "MEDIUM | RHEL-10-600485 | PATCH | RHEL 10 must ensure the password complexity module in the system-auth file is configured for three or fewer retries."
  when:
    - rhel10stig_600485
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-600485
    - CAT2
    - CCI-NA
    - SRG-OS-000069-GPOS-00037
    - SV-281204r1197240_rule
    - V-281204
    - NIST800-53R4_NA
    - pam
  block:
    - name: "MEDIUM | RHEL-10-600485 | PATCH | RHEL 10 must ensure the password complexity module in the system-auth file is configured for three retries or less."
      ansible.builtin.find:
        paths:
          - /etc/security/pwquality.conf.d
        pattern: '^#?retry\s*=\s*\d*$'
      changed_when: false
      register: discovered_pwquality_retry_conf_files

    - name: "MEDIUM | RHEL-10-600485 | PATCH | RHEL 10 must ensure the password complexity module in the system-auth file is configured for three or fewer retries. | Set if no pw required pam_pwquality"
      when:
        - discovered_pwquality_retry_conf_files.matched > 0
        - "item.path not /etc/security/pwquality.conf.d/stig_passwd.conf"
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: '^(retry\s*=\s*\d*)$'
        line: '#\1'
        backrefs: true
      loop: "{{ discovered_pwquality_retry_conf_files.files }}"

    - name: "MEDIUM | RHEL-10-600485 | PATCH | RHEL 10 must ensure the password complexity module in the system-auth file is configured for three or fewer retries. | Set if no pw required pam_pwquality"
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^(retry\s*=\s*\d*)$'
        line: '#\1'
        backrefs: true

    - name: "MEDIUM | RHEL-10-600485 | PATCH | RHEL 10 must ensure the password complexity module in the system-auth file is configured for three or fewer retries. | Replace if already exists"
      ansible.builtin.template:
        src: etc/security/pwquality.conf.d/stig_passwd.conf.j2
        dest: /etc/security/pwquality.conf.d/stig_passwd.conf
        mode: 'o-rwx'
        owner: root
        group: root

