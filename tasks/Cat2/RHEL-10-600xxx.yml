- name: "MEDIUM | RHEL-10-600270 | PATCH | RHEL 10 must enforce that passwords have a 24 hours/1 day minimum lifetime restriction in /etc/shadow"
  when: rhel10stig_600270
  tags:
    - RHEL-10-600270
    - CAT2
    - CCI-NA
    - SRG-OS-000075-GPOS-00043
    - SV-281186r1184622_rule
    - V-281186
    - NIST800-53R4_NA
    - login
    - users
  block:
    - name: "MEDIUM | RHEL-10-600270 | AUDIT | RHEL 10 passwords must have a 24 hours minimum password lifetime restriction in /etc/shadow. | Capture accts"
      ansible.builtin.command: "awk -F: '$4 < 1 {printf \"%s %d\\n\", $1, $4}' /etc/shadow"
      changed_when: false
      failed_when: discovered_24hr_passwd_restrict.rc not in [ 0, 1 ]
      register: discovered_24hr_passwd_restrict

    - name: "MEDIUM | RHEL-10-600270 | PATCH | RHEL 10 passwords must have a 24 hours minimum password lifetime restriction in /etc/shadow."
      when:
        - discovered_24hr_passwd_restrict.stdout | length > 0
        - rhel10stig_disruption_high
        - item in discovered_interactive_users_accounts
      ansible.builtin.command: "passwd -n 1 {{ item }}"
      changed_when: true
      loop: "{{ discovered_24hr_passwd_restrict.stdout_lines }}"

    - name: "MEDIUM | RHEL-10-600270 | WARN | RHEL 10 passwords must have a 24 hours minimum password lifetime restriction in /etc/shadow. | Warning"
      when:
        - discovered_24hr_passwd_restrict.stdout | length > 0
        - not rhel10stig_disruption_high
      ansible.builtin.debug:
        msg: "Warning!! Accounts have been found to have an incorrect password lifetime"

    - name: "MEDIUM | RHEL-10-600270 | WARN | RHEL 10 passwords must have a 24 hours minimum password lifetime restriction in /etc/shadow. | Warning"
      when:
        - discovered_24hr_passwd_restrict.stdout | length > 0
        - not rhel10stig_disruption_high
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-600270"

