---

- name: PRELIM | Interactive Users
  tags: always
  ansible.builtin.shell: |
    set -o pipefail
    grep -Ev 'nologin|/sbin' /etc/passwd | awk -F: '$3 >= {{ min_int_uid | int }} {print $1}'
  args:
    executable: "{{ rhel10stig_shell_executable }}"
  changed_when: false
  register: discovered_interactive_users_accounts

- name: PRELIM | Gather accounts with empty password fields
  when: rhel10stig_600460
  tags: passwords
  ansible.builtin.shell: |
    set -o pipefail
    cat /etc/shadow | awk -F: '($2 == "" ) {j++;print $1; } END {exit j}'
  args:
    executable: "{{ rhel10stig_shell_executable }}"
  changed_when: false
  failed_when: discovered_empty_password_accounts.rc not in [ 0, 1 ]
  register: discovered_empty_password_accounts

- name: "MEDIUM | RHEL-10-600000 | PATCH | RHEL 10 must require a boot loader superuser password."
  when:
    - rhel10stig_600000
    - rhel10stig_set_boot_pass
    - not system_is_container
  tags:
    - RHEL-10-600000
    - CAT2
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-281166r1166450_rule
    - V-281166
    - NIST800-53R4_AC-3
    - grub
  block:
    - name: "MEDIUM | RHEL-10-600000 | PATCH | RHEL 10 must require a boot loader superuser password. | | Set fact if using salt (no python passlib required)"
      when: rhel10stig_bootloader_salt | length == 0
      ansible.builtin.set_fact:
        rhel10stig_compiled_bootloader_password: "{{ rhel10stig_bootloader_password_hash }}"

    - name: "MEDIUM | RHEL-10-600000 | PATCH | RHEL-10-600000 | PATCH | RHEL 10 must require a boot loader superuser password. | Set fact if using salt (python passlib required)"
      when: rhel10stig_bootloader_salt | length > 0
      ansible.builtin.set_fact:
        rhel10stig_compiled_bootloader_password: "{{ (rhel10stig_bootloader_password | grub_hash(salt=rhel10stig_bootloader_salt)) }}"

    - name: "MEDIUM | RHEL-10-600000 | PATCH | RHEL-10-600000 | PATCH | RHEL 10 must require a boot loader superuser password."
      ansible.builtin.copy:
        dest: /boot/grub2/user.cfg
        content: "GRUB2_PASSWORD={{ rhel10stig_compiled_bootloader_password }}"
        mode: '0600'
        owner: root
        group: root

- name: "MEDIUM | RHEL-10-600010 | PATCH | RHEL 10 must require a unique superusers name upon booting into single-user and maintenance mode."
  when:
    - rhel10stig_600010
    - not system_is_container
    - rhel10stig_set_boot_pass
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-600010
    - CAT2
    - CCI-002038
    - SRG-OS-000080-GPOS-00048
    - SV-281167r1166453_rule
    - V-281167
    - NIST800-53R4_AC-3
    - grub
  block:
    - name: "MEDIUM | RHEL-10-600010 | PATCH | RHEL 10 must require a unique superusers name upon booting into single-user and maintenance mode. | Set superusers name"
      notify: Rebuild grub
      ansible.builtin.lineinfile:
        path: /etc/grub.d/01_users
        regexp: '^set superusers=".*"'
        line: "set superusers=\"{{ rhel10stig_grub_superuser }}\""

    - name: "MEDIUM | RHEL-10-600010 | PATCH | RHEL 10 must require a unique superusers name upon booting into single-user and maintenance mode. | Align password_pbkdf2 user to the superuser"
      notify: Rebuild grub
      ansible.builtin.replace:
        path: /etc/grub.d/01_users
        regexp: '^(\s*password_pbkdf2\s+)\S+'
        replace: '\1{{ rhel10stig_grub_superuser }}'

- name: "MEDIUM | RHEL-10-600020 | PATCH | RHEL 10 system accounts must not have an interactive login shell."
  when:
    - rhel10stig_600020
    - item.id != "root"
    - item.uid < min_int_uid | int
    - item.shell != "      /bin/false"
    - item.shell != "      /sbin/nologin"
  tags:
    - RHEL-10-600020
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-281168r1195416_rule
    - V-281168
    - NIST800-53R4_CM-6
  ansible.builtin.user:
    name: "{{ item.id }}"
    shell: /sbin/nologin
  loop: "{{ prelim_captured_passwd_data }}"
  loop_control:
    label: "{{ item.id }}"

- name: "MEDIUM | RHEL-10-600100 | PATCH | RHEL 10 user account passwords for new users or password changes must have a 60-day maximum password lifetime restriction in /etc/login.defs."
  when: rhel10stig_600100
  tags:
    - RHEL-10-600100
    - CAT2
    - CCI-000199
    - SRG-OS-000076-GPOS-00044
    - SV-281169r1166459_rule
    - V-281169
    - NIST800-53R4_IA-5
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: ^(#|)\s*PASS_MAX_DAYS
    line: "PASS_MAX_DAYS {{ rhel10stig_pass_max_days }}"

- name: "MEDIUM | RHEL-10-600110 | PATCH | RHEL 10 user account passwords for new users or password changes must have a 60-day maximum password lifetime restriction in /etc/login.defs."
  when: rhel10stig_600110
  tags:
    - RHEL-10-600110
    - CAT2
    - CCI-NA
    - SRG-OS-000076-GPOS-00044
    - SV-281170r1184651_rule
    - V-281170
    - NIST800-53R4_NA
  block:
    - name: "MEDIUM | RHEL-10-600110 | AUDIT | RHEL 10 user account passwords for new users or password changes must have a 60-day maximum password lifetime restriction in /etc/login.defs."
      ansible.builtin.command: "awk -F: '$1 !~ /^root$/ && $2 !~ /^[!*]/ && $5 > {{ rhel10stig_pass_max_days }} {print $1}' /etc/shadow"
      changed_when: false
      failed_when: discovered_users_passwd_max.rc not in [ 0, 1 ]
      register: discovered_users_passwd_max

    - name: "MEDIUM | RHEL-10-600110 | PATCH | RHEL 10 user account passwords for new users or password changes must have a 60-day maximum password lifetime restriction in /etc/login.defs."
      when:
        - rhel10stig_disruption_high
        - discovered_users_passwd_max is defined
        - discovered_users_passwd_max.stdout | length > 0
        - "ansible_user not in item"
      ansible.builtin.command: "passwd -x {{ rhel10stig_pass_max_days }} {{ item }}"
      changed_when: true
      failed_when: discovered_users_passwd_max.rc not in [ 0, 1 ]
      loop: "{{ discovered_users_passwd_max.stdout_lines }}"

    - name: "MEDIUM | RHEL-10-600110 | WARN | RHEL 10 user account passwords for new users or password changes must have a 60-day maximum password lifetime restriction in /etc/login.defs."
      when:
        - not rhel10stig_disruption_high or (ansible_facts['user_id'] in discovered_interactive_users_accounts.stdout_lines)
        - discovered_users_passwd_max is defined
        - discovered_users_passwd_max.stdout | length > 0
      ansible.builtin.debug:
        msg: "Warning!! The following users do not match maximum password life {{ discovered_users_passwd_max.stdout_lines }}"

    - name: "MEDIUM | RHEL-10-600110 | WARN | RHEL 10 user account passwords for new users or password changes must have a 60-day maximum password lifetime restriction in /etc/login.defs.| Warning Count"
      when:
        - not rhel10stig_disruption_high
        - discovered_users_passwd_max is defined
        - discovered_users_passwd_max.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-600110"

- name: "MEDIUM | RHEL-10-600120 | PATCH | All RHEL 10 local interactive user accounts must be assigned a home directory upon creation."
  when: rhel10stig_600120
  tags:
    - RHEL-10-600120
    - CAT2
    - CCI-002824
    - SRG-OS-000480-GPOS-00227
    - SV-281171r1166465_rule
    - V-281171
    - NIST800-53R4_SI-16
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: (?i)^(#?)\s*CREATE_HOME (no|yes)
    line: "CREATE_HOME yes"

- name: "MEDIUM | RHEL-10-600130 | PATCH | RHEL 10 duplicate User IDs (UIDs) must not exist for interactive users."
  when: rhel10stig_600130
  tags:
    - RHEL-10-600130
    - CAT2
    - CCI-000764
    - CCI-000804
    - SRG-OS-000104-GPOS-00051
    - SV-281172r1166468_rule
    - V-281172
    - NIST800-53R4_IA-2
    - NIST800-53R4_IA-8
  block:
    - name: "MEDIUM | RHEL-10-600130 | PATCH | RHEL 10 duplicate User IDs (UIDs) must not exist for interactive users."
      ansible.builtin.shell: |
        set -o pipefail
        cat /etc/passwd | awk -F: '{ print $3}' | sort -n | uniq -d
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_duplicate_uids.rc not in [ 0, 1 ]
      register: discovered_duplicate_uids

    - name: "MEDIUM | RHEL-10-600130 | WARN | RHEL 10 duplicate User IDs (UIDs) must not exist for interactive users."
      when:
        - discovered_duplicate_uids is defined
        - discovered_duplicate_uids.stdout | length > 0
      ansible.builtin.debug:
        msg: "Warning!! Duplicate UIDs have been found Please investigate"

    - name: "MEDIUM | RHEL-10-600130 | WARN | RHEL 10 duplicate User IDs (UIDs) must not exist for interactive users."
      when:
        - discovered_duplicate_uids is defined
        - discovered_duplicate_uids.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-600130"

- name: "MEDIUM | RHEL-10-600140 | WARN | RHEL 10 must automatically expire temporary accounts within 72 hours."
  when: rhel10stig_600140
  tags:
    - RHEL-10-600140
    - CAT2
    - CCI-000016
    - CCI-001682
    - SRG-OS-000123-GPOS-00064
    - SRG-OS-000002-GPOS-00002
    - SV-281173r1166471_rule
    - V-281173
    - NIST800-53R4_AC-2
  block:
    - name: "MEDIUM | RHEL-10-600140 | WARN | RHEL 10 must automatically expire temporary accounts within 72 hours."
      ansible.builtin.debug:
        msg:
          - "WARNING!!  Please check temporary accounts for expiration dates to be 72 hours or less."
          - "To do this please run sudo chage -l account_name for the accounts you need to check"
          - "The results will display the Account Expires information"
          - 'To set account expire run sudo chage -E `date -d "+3 days" +%Y-%m-%d` account_name'

    - name: "MEDIUM | RHEL-10-600140 | WARN | RHEL 10 must automatically expire temporary accounts within 72 hours."
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-600140"

- name: "MEDIUM | RHEL-10-600150 | AUDIT | RHEL 10 must assign a primary group to all interactive users"
  when: rhel10stig_600150
  tags:
    - RHEL-10-600150
    - CAT2
    - CCI-000764
    - SRG-OS-000104-GPOS-00051
    - SV-281174r1166474_rule
    - V-258048
    - NIST800-53R4_AC-2
  block:
    - name: "MEDIUM | RHEL-10-600150 | AUDIT | All RHEL 10 interactive users must have a primary group that exists."
      ansible.builtin.command: pwck -qr
      changed_when: false
      failed_when: discovered_gid_exists.rc not in [ 0, 1, 2 ]
      register: discovered_gid_exists

    - name: "MEDIUM | RHEL-10-600150 | AUDIT | All RHEL 10 interactive users must have a primary group that exists."
      ansible.builtin.shell: |
        set -o pipefail
        cat /etc/passwd | awk -F: '{ print $4 }' | sort | uniq -d | awk '$1 > {{ min_int_uid | int }}'
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_duplicate_gids.rc not in [ 0, 1 ]
      register: discovered_duplicate_gids

    - name: "MEDIUM | RHEL-10-600150 | WARN | All RHEL 10 interactive users must have a primary group that exists."
      when: discovered_duplicate_gids is defined or discovered_gid_exists is defined
      ansible.builtin.debug:
        msg: "Warning!! Issues with primary user groups have been found Please investigate"
      loop: "{{ discovered_duplicate_gids.stdout_lines }}"

    - name: "MEDIUM | RHEL-10-600150 | WARN | All RHEL 10 interactive users must have a primary group that exists.."
      when:
        - discovered_duplicate_gids is defined
        - discovered_duplicate_gids.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "MEDIUM | RHEL-10-600150"

- name: "MEDIUM | RHEL-10-600160 | PATCH | RHEL 10 must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity."
  when: rhel10stig_600160
  tags:
    - RHEL-10-600160
    - CAT2
    - CCI-NA
    - SV-281175r1197238_rule
    - V-281175
    - NIST800-53R4_NA
  block:
    - name: "MEDIUM | RHEL-10-600160 | AUDIT | RHEL 10 must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity."
      ansible.builtin.shell: |
        set -o pipefail
        grep -i inactive /etc/default/useradd | cut -f2 -d=
      args:
        executable: "{{ rhel10stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_inactive_user_setting.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_inactive_user_setting

    - name: "MEDIUM | RHEL-10-600160 | PATCH | RHEL 10 must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity."
      when:
        - discovered_inactive_user_setting is defined
        - "'-1' in discovered_inactive_user_setting.stdout"
        - "rhel10stig_user_inactive_days not in discovered_inactive_user_setting.stdout"
      ansible.builtin.command: "useradd -D -f {{ rhel10stig_user_inactive_days }}"
      changed_when: true

- name: "MEDIUM | RHEL-10-600170 | PATCH | Executable search paths within the initialization files of all local interactive RHEL 10 users must only contain paths that resolve to the system default or the users home directory."
  when: rhel10stig_600170
  tags:
    - RHEL-10-600170
    - CAT2
    - CCI-NA
    - SRG-OS-000362-GPOS-00149
    - SV-281176r1166480_rule
    - V-281176
    - NIST800-53R4_NA
  block:
    - name: "MEDIUM | RHEL-10-600170 | AUDIT | Executable search paths within the initialization files of all local interactive RHEL 10 users must only contain paths that resolve to the system default or the users home directory."
      ansible.builtin.find:
        path: "{{ rhel10stig_home_filesystem }}"
        contains: PATH=\".*\"
        depth: 2
        file_type: file
        hidden: true
        read_whole_file: true
        recurse: true
        use_regex: true
      register: discovered_user_initialization

    - name: "MEDIUM | RHEL-10-600170 | PATCH | Executable search paths within the initialization files of all local interactive RHEL 10 users must only contain paths that resolve to the system default or the users home directory."
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: ^\s*PATH
        line: "PATH={{ rhel10stig_env_path }}"
      loop: "{{ discovered_user_initialization.files }}"

- name: |
    "MEDIUM | RHEL-10-600180 | PATCH | All RHEL 10 local interactive users must have a home directory assigned in the /etc/passwd file."
    "MEDIUM | RHEL-10-600190 | PATCH | All RHEL 10 local interactive user home directories defined in the /etc/passwd file must exist."
  when:
    - rhel10stig_600180 or
      rhel10stig_600190
  tags:
    - RHEL-10-600180
    - RHEL-10-600190
    - CAT2
    - CCI-002385
    - SRG-OS-000420-GPOS-00186
    - SV-281177r1184748_rule
    - SV-281178r1195418_rule
    - V-281177
    - V-281178
    - NIST800-53R4_SC-5
    - users
  block:
    - name: |
        "MEDIUM | RHEL-10-600180 | PATCH | All RHEL 10 local interactive users must have a home directory assigned in the /etc/passwd file."
        "MEDIUM | RHEL-10-600190 | PATCH | All RHEL 10 local interactive user home directories defined in the /etc/passwd file must exist."
      ansible.builtin.file:
        path: "{{ item.dir }}"
        state: directory
        owner: "{{ item.id }}"
        group: "{{ item.gid }}"
        mode: 'o-rwx'
      register: discovered_home_dir
      loop: "{{ prelim_captured_passwd_data | selectattr('uid', '>=', min_int_uid | int) | selectattr('uid', '<=', max_int_uid | int) | list }}"
      loop_control:
        label: "{{ item.id }}"

    # set default ACLs so the homedir has an effective umask of 0027
    - name: |
        "MEDIUM | RHEL-10-600180 | PATCH | All RHEL 10 local interactive users must have a home directory assigned in the /etc/passwd file."
        "MEDIUM | RHEL-10-600190 | PATCH | All RHEL 10 local interactive user home directories defined in the /etc/passwd file must exist."
      ansible.posix.acl:
        path: "{{ item.path }}"
        default: true
        etype: group
        permissions: rx
        state: present
      loop: "{{ discovered_home_dir.results }}"
      when: not system_is_container

    - name: |
        "MEDIUM | RHEL-10-600180 | PATCH | All RHEL 10 local interactive users must have a home directory assigned in the /etc/passwd file."
        "MEDIUM | RHEL-10-600190 | PATCH | All RHEL 10 local interactive user home directories defined in the /etc/passwd file must exist."
      ansible.posix.acl:
        path: "{{ item.path }}"
        default: true
        etype: other
        permissions: 0
        state: present
      loop: "{{ discovered_home_dir.results }}"
      when: not system_is_container

- name: "MEDIUM | RHEL-10-600200 | PATCH | RHEL 10 must enforce a delay of at least four seconds between logon prompts following a failed logon attempt."
  when: rhel10stig_600200
  tags:
    - RHEL-10-600200
    - CAT2
    - CCI-002238
    - SRG-OS-000329-GPOS-00128
    - SV-281179r1166489_rule
    - V-281179
    - NIST800-53R4_AC-7
    - login
    - users
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: ^(#?)\s*FAIL_DELAY
    line: "FAIL_DELAY {{ rhel10stig_login_defs_fail_delay }}"

- name: "MEDIUM | RHEL-10-600210 | PATCH | RHEL 10 passwords for new users or password changes must have a 24 hours minimum password lifetime restriction in /etc/login.defs."
  when:
    - rhel10stig_600210
    - rhel10stig_disruption_high
  tags:
    - RHEL-10-600210
    - CAT2
    - CCI-NA
    - SRG-OS-000075-GPOS-00043
    - SV-281180r1166492_rule
    - V-281180
    - NIST800-53R4_NA
    - login
    - users
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: \s*PASS_MIN_DAYS\s*
    line: "PASS_MIN_DAYS {{ rhel10stig_pass_min_days }}"
    backrefs: true

- name: "MEDIUM | RHEL-10-600220 | PATCH | RHEL 10 passwords must be created with a minimum of 15 characters."
  when: rhel10stig_600220
  tags:
    - RHEL-10-600220
    - CAT2
    - CCI-NA
    - SRG-OS-000078-GPOS-00046
    - SV-281181r1195421_rule
    - V-281181
    - NIST800-53R4_NA
    - login
    - users
  block:
    - name: "MEDIUM | RHEL-10-600220 | PATCH | RHEL 10 passwords must be created with a minimum of 15 characters."
      ansible.builtin.file:
        path: /etc/security/pwquality.conf.d
        state: directory
        mode: 'o-rwx'
        owner: root
        group: root

    - name: "MEDIUM | RHEL-10-600220 | PATCH | RHEL 10 passwords must be created with a minimum of 15 characters."
      ansible.builtin.template:
        src: etc/security/pwquality.conf.d/stig_passwd.conf.j2
        dest: /etc/security/pwquality.conf.d/stig_passwd.conf
        mode: 'o-rwx'
        owner: root
        group: root

