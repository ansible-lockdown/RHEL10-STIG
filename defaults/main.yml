rhel10stig_home_filesystem: '/home'

## 25xxxx
# 252040 - DNS processing mode in Network Manager - Must be one of the following: default, none, systemd-resolved
# default: NetworkManager will update /etc/resolv.conf to reflect the nameservers provided by currently active connections.
# none: NetworkManager will not modify /etc/resolv.conf. Used when DNS is managed manually or by another service.
# systemd-resolved: Uses systemd-resolved to manage DNS.
rhel10stig_dns_processing_mode: 'none'

## Firewalld
# rhel10stig_custom_firewall_zone is the desired name for the firewall zone
rhel10stig_custom_firewall_zone: "drop"
rhel10stig_custom_firewall_interface: "{{ ansible_facts['default_ipv4']['interface'] | list }}"

# rhel10stig_white_list_services is the services that you want to allow through initially for the new firewall zone
# This can also be a port number if no service exists
# Examples below
rhel10stig_white_list_services:
- name: ssh
- name: dns
- name: ntp
# - port: 53
# - protocol: udp
# - port: 53
# - protocol: tcp

## Interface list allowed to have promiscuous mode set
rhel10stig_promisc_if:
- none

# Set sysctl files
# Sysctl file
rhel10stig_sysctl_file_default: /etc/sysctl.d/99-sysctl.conf
# rhel10stig_sysctl_file:
#   fs: "{{ rhel10stig_sysctl_file_default }}"
#   kernel: "{{ rhel10stig_sysctl_file_default }}"
#   network: "{{ rhel10stig_sysctl_file_default }}"
#   user: "{{ rhel10stig_sysctl_file_default }}"
# Systems that run containers must set this value to greater then 0 for example: 65536
# rhel10stig_sysctl_max_user_namespaces: '0'

## Chrony
rhel10stig_time_synchronization_servers:
- '0.us.pool.ntp.mil'
- '1.us.pool.ntp.mil'
rhel10stig_chrony_server_options: "iburst maxpoll 16"  # The Max Setting is maxpoll 16

## fapolicy
# Allow adding of fapolicy rules to be updated - also needs rhel10stig_disruption_high
rhel10stig_allow_fapolicy_updates: false

# rhel10stig_fapolicy_white_list is the whitelist for fapolicyd
rhel10stig_fapolicy_white_list:
- '# Allow Ansible'
- "allow perm=any trust=1 : dir={{ ansible_facts['env']['PWD'] }}/.ansible/"
- 'allow perm=any trust=1 : dir=/root/.ansible/'
- 'allow perm=any trust=1 : dir=/tmp/ansible/'

## DNS
# Please adjust accordingly for ipv4 or ipv6
rhel10stig_dns_ip4_servers:
- 8.8.8.8
- 8.8.4.4

# rhel10stig_dns_ip6_servers:
#   - '2001:4860:4860::8888'
#   - '2001:4860:4860::8844'

## Optional settings Please adjust accordingly for your environment
# rhel10stig_resolv_domains:
# - example.com
# rhel10stig_resolv_search_options: example.com example1.com
# rhel10stig_resolv_dns_options: 'timeout:2 rotate'

## Mail Settings
rhel10stig_postfix_client_conf: permit_mynetworks,reject

### ACCOUNTS and AUTH ###
## PAM and password settings
rhel10stig_pass_max_days: 60
rhel10stig_pass_min_days: 1
rhel10stig_pass_minlen: '15'

rhel10stig_user_inactive_days: '35'  # 35 or less is compliant

# Path to set for users initialization files e.g. echo $PATH expected results
rhel10stig_env_path: '$PATH:$HOME/.local/bin:$HOME/bin'

# Authselect profile settings
# If Set to true will use authselect - Can cause disruption to authentication
# if false will use the legacy method
rhel10stig_uses_authselect: false

##### rhel10stig_authselect_custom_profile: minimal

# Faillock settings
rhel10stig_faillock_deny: '3'  # 3 or less but not 0
rhel10stig_faillock_fail_interval: '900'  # 900 or less is required not '0'
rhel10stig_faillock_unlock_time: 0  # should be set to 0 unless documented
rhel10stig_faillock_dir: '/var/log/faillock'

# rhel10stig_unnecessary_accounts:
# - ftp
# - games
##### rhel10stig_remove_unnecessary_user_files: false

rhel10stig_login_defs_fail_delay: '4'

##### rhel10stig_logind_conf_stopsessionidle: '600'

rhel10stig_pam_retry: '3'  # must be set between 1-3, anything else is a failure
rhel10stig_pam_rounds: '5000'

rhel10stig_pwquality_dcredit: -1
rhel10stig_pwquality_dictcheck: 1
rhel10stig_pwquality_difok: 8
rhel10stig_pwquality_lcredit: -1
rhel10stig_pwquality_maxclassrepeat: 4
rhel10stig_pwquality_maxrepeat: 3
rhel10stig_pwquality_minclass: 4
rhel10stig_pwquality_ocredit: -1
rhel10stig_pwquality_ucredit: -1

rhel10stig_sudoers_exclude_nopasswd_list:
- ec2-user
- vagrant

rhel10stig_smartcard_reader: false

### SSSD
rhel10stig_configure_sssd: false
rhel10stig_sssd_config_certmap: |
  [certmap/{{ rhel10stig_sssd.domain }}/{{ rhel10stig_sssd.rulename }}"]
  matchrule ='.*example@mil'
  maprule = (userCertificate;binary={cert!bin})
  domains = example.com

### Aide
# AIDE is a file integrity checking tool, similar in nature to Tripwire.
# While it cannot prevent intrusions, it can detect unauthorized changes
# to configuration files by alerting when the files are changed. Review
# the AIDE quick start guide and AIDE documentation before proceeding.
# By setting this variable to `true`, all of the settings related to AIDE will be applied!
rhel10stig_use_aide: true

# If DB file older than below will automatically rebuild DB
# e.g. options:1w = 1 week, 1d = 1day 1h = 1 hour
rhel10stig_aide_db_file_age: 1w

# If aide already setup this forces a new DB to be created despite age
rhel10stig_aide_db_recreate: false

# New db file
rhel10stig_aide_db_new_file: /var/lib/aide/aide.db.new.gz
# Active db file
rhel10stig_aide_db_file: /var/lib/aide/aide.db.gz

# Must run a minimum of weekly
rhel10stig_aide_cron_file: /etc/cron.daily/aide  # NOTE the path may change if not running daily
rhel10stig_aide_cron_day: '*'
rhel10stig_aide_cron_hour: '4'
rhel10stig_aide_cron_minute: '30'
rhel10stig_aide_cron_job: '/usr/sbin/aide --check | /bin/mail -s "$HOSTNAME - Daily aide integrity check run" root@sysname.mil'
rhel10stig_aide_cron_name: 'Aide Job runs Daily at {{ rhel10stig_aide_cron_hour }}:{{ rhel10stig_aide_cron_minute }}'

# AIDE is a file integrity checking tool, similar in nature to Tripwire.
# While it cannot prevent intrusions, it can detect unauthorized changes
# to configuration files by alerting when the files are changed. Review
# the AIDE quick start guide and AIDE documentation before proceeding.
# By setting this variable to `true`, all of the settings related to AIDE will be applied!
##### rhel10stig_config_aide: true

### Rsyslog
# Set the type either rsyslogd or syslog-ng this sets the audit tools binary as referred to controls
# RHEL-10-232035, RHEL-10-232220, RHEL-10-232225
rhel10stig_syslog_binary: rsyslogd
# Set the following to true if the server accepts incoming syslog data using rsyslog
rhel10stig_rsyslog_server: false

# Adjust to match remote syslog server configuration
# There are two ways to offload
# 1. Legacy way - using @@
# 2. New way - using Rainer scripts
# The new way is more secure and is the preferred method.

# If using legacy offload, set this to true
# If using Rainer scripts offload, set this to false
rhel10stig_rsyslog_legacy_offload: false

# Standard settings for remote syslog server
# Server IP address
rhel10stig_rsyslog_remote_server_ip: 10.10.10.10
# Server port
rhel10stig_rsyslog_remote_server_port: 9999
# Server protocol
rhel10stig_rsyslog_remote_server_protocol: '@@'

# Stream driver settings for rainerscripts offload
# Stream driver type
rhel10stig_rsyslog_stream_driver: 'gtls'
# Stream driver mode
rhel10stig_rsyslog_stream_driver_mode: '1'
# Stream driver authentication mode
rhel10stig_rsyslog_stream_driver_auth_mode: 'x509/name'
# Stream driver permitted peers
rhel10stig_rsyslog_stream_driver_permitted_peers: 'central.example.net'

### AUDITD
# Ensure this matches the filesystem where the audit logs are stored.
# It will affect checks for control RHEL-10-653030
rhel10stig_auditd_required: true
rhel10stig_audit_log_filesystem: '/var/log/audit'
# Audit log space left
# Accepted values can be one of "25%" or less
rhel10stig_audit_conf_space_left: 25%
# Audit log name format
# Accepted values can be one of "hostname", "fqdn", "numeric", "fqn"
rhel10stig_audit_conf_name_format: hostname
# Audit log admin space left
# Accepted values can be one of "5%" or less
rhel10stig_audit_conf_admin_space_left: 5%
# Audit log admin space left action
# Only accepted value is "single" - unless otherwise documented
rhel10stig_audit_conf_admin_space_left_action: single
# Audit log overflow action
# Accepted values can be one of "syslog", "single", or "halt"
rhel10stig_audit_conf_overflow_action: syslog
# Audit log format
# Only accepted value is: "ENRICHED" - unless otherwise documented
rhel10stig_audit_conf_log_format: ENRICHED
# Audit log frequency
# Accepted values must be 100 or greater
rhel10stig_audit_conf_freq: '100'
# Audit log space left action
# Only accepted value is "email" - unless otherwise documented
rhel10stig_audit_conf_space_left_action: email
# Audit log email account
# Account to send email to for audit log errors
rhel10stig_audit_conf_action_mail_acct: root
# Audit log file group
# Group to set for audit log file
rhel10stig_audit_conf_logfile_group: root

rhel10stig_audit_backlog_limit: 8192
# Audit binaries
rhel10stig_audit_bins:
- '/usr/sbin/auditctl'
- '/usr/sbin/aureport'
- '/usr/sbin/ausearch'
- '/usr/sbin/autrace'
- '/usr/sbin/auditd'
- '/usr/sbin/{{ rhel10stig_syslog_binary }}'  # Note you may not need this is container
- '/usr/sbin/augenrules'

## Advanced option found in auditd post
# This variable governs if defining user exceptions for auditd logging is acceptable.
# Ensure that this is documented in your exceptions list for any auditors
rhel10stig_allow_auditd_uid_user_exclusions: false
# This variable contains a list of uids to be excluded(users whose actions are not logged by auditd)
rhel10stig_auditd_uid_exclude:
- 1999
