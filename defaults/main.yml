---

## metadata for Audit benchmark
benchmark_version: 'v1r1'

## Benchmark name used by auditing control role
# The audit variable found at the base
benchmark: RHEL10-STIG

# Whether to skip the OS check for supported OS's
skip_os_check: false

# Whether to skip the FIPS mode check
# This affects many tasks and would put you in a non-compliant state.
# In order not skip fips it needs to be enabled at installation time.
# https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/10/html/security_hardening/switching-rhel-to-fips-mode
# The only correct way to switch the system to FIPS mode is to enable it during the OS installation.
# We do not test for any other method to enable FIPS mode.
skip_fips_mode: false

rhel10stig_cat1: true
rhel10stig_cat2: true
rhel10stig_cat3: true

# We've defined disruption-high to indicate items that are likely to cause
# disruption in a normal workflow.  These items can be remediated automatically
# but are disabled by default to avoid disruption.
rhel10stig_disruption_high: false

# Set if system uses ipv6
rhel10stig_system_uses_ipv6: false

# Place to find the container yml file for your environment - /vars/...
container_vars_file: is_container.yml

# rhel10stig is left off the front of this var for consistency in testing pipeline
# system_is_ec2 toggle will disable tasks that fail on Amazon EC2 instances. Set true to skip and false to run tasks
system_is_ec2: false

# Create managed not custom local_facts files
create_benchmark_facts: true
ansible_facts_path: /etc/ansible/facts.d

# Connecting user, due to the way many users work differently this is to try and assist the use of connecting user if required
# This is useful when part of kickstart build or running as root and not defining the ansible_user option
# used @ RHEL-10-411015
# This variable governs whether the system uses the root account directly.
# When set to true, tasks that would otherwise restrict or skip root-based access are adjusted accordingly.
rhel10stig_uses_root: false
rhel10stig_default_user: root
rhel10stig_connecting_user: "{{ ansible_facts['env']['SUDO_USER'] | default(rhel10stig_default_user) }}"
rhel10stig_playbook_user: "{{ ansible_user | default(rhel10stig_connecting_user) }}"

# Whether to skip the reboot
skip_reboot: true

# system acts or requires router networking options
rhel10stig_system_is_router: false
###
### Settings for associated Audit role using Goss
###

###########################################
### Goss is required on the remote host ###
### vars/auditd.yml for other settings  ###

## Audit setup
# Audits are carried out using Goss. This variable
# determines whether execution of the role prepares for auditing
# by installing the required binary.
setup_audit: false

## Enable audits to run - this runs the audit and get the latest content
# This variable governs whether the audit using the
# separately maintained audit role using Goss
# is carried out.
# This runs the audit and gets the latest content
run_audit: false
# Run heavy tests - some tests can have more impact on a system enabling these can have greater impact on a system
audit_run_heavy_tests: true

## Only run Audit do not remediate
audit_only: false

#############################

## Ability to collect and take audit files moving to a centralized location
# This enables the collection of the files from the host
fetch_audit_output: false

# Method of getting,uploading the summary files
## Ensure access and permissions are available for these to occur.
## options are
# fetch - fetches from server and moves to location on the ansible controller (could be a mount point available to controller)
# copy - copies file to a location available to the managed node
audit_output_collection_method: fetch

# Location to put the audit files
audit_output_destination: /opt/audit_summaries/

### Goss Settings ##
####### END ########

