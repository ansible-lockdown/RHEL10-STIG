### CONTROLS

## Graphical/Gnome interface approved to be present
rhel10stig_gui_approved: false

# If gui not installed
rhel10stig_gui: "{{ prelim_gnome_present.stat.exists | default(false) }}"

## SSHD
rhel10stig_sshd_required: true
rhel10stig_sshd_config_file: /etc/ssh/sshd_config

rhel10stig_sshd_config_ciphers: Ciphers aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr
rhel10stig_sshd_config_clientalivecountmax: 1
rhel10stig_sshd_config_clientaliveinterval: 600  # max 600
rhel10stig_sshd_config_gssapiauth: 'no'
rhel10stig_sshd_config_hostauth: 'no'
rhel10stig_sshd_config_ignoreknownhosts: 'yes'
rhel10stig_sshd_config_ignorerhosts: 'yes'
rhel10stig_sshd_config_kerbauth: 'no'
rhel10stig_sshd_config_lastlog: 'yes'
rhel10stig_sshd_config_loglevel: VERBOSE
rhel10stig_sshd_config_macs: MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512
rhel10stig_sshd_config_maxlogins: 10
rhel10stig_sshd_config_pubkeyauth: 'yes'
rhel10stig_sshd_config_permitroot: 'no'
##### rhel10stig_sshd_config_privsep: sandbox
rhel10stig_sshd_config_rekeylimit: '1G 1h'
rhel10stig_sshd_config_strictmodes: 'yes'
rhel10stig_sshd_config_userenv: 'no'
rhel10stig_sshd_config_x11forward: 'no'
rhel10stig_sshd_config_x11uselocal: 'yes'

################## bootloader password #####################################
#
# Two options for setting the bootloader password
#
# Will also need to add the set_boot_pass variable to the task to ensure the password is set.
#
# This variable governs whether a bootloader password should be set in '/boot/grub2/user.cfg' file.
rhel10stig_set_boot_pass: false
#
# Option 1: Set the bootloader password and salt – requires the passlib Python module
# to be available on the Ansible controller.
# Set this value to something secure to have predictable hashes,
# which will prevent unnecessary changes.

rhel10stig_bootloader_salt: ''

# This variable stores the GRUB bootloader password to be written
# to the '/boot/grub2/user.cfg' file. The default value must be changed.

rhel10stig_bootloader_password: 'password'  # pragma: allowlist secret

# Option 2: Set the bootloader password hash – if the salt value is empty,
# the password will be set using the variable below.
# If you are not using the bootloader hash filter, you can set it here
# in encrypted format, e.g. grub.pbkdf2.sha512.hashstring

rhel10stig_bootloader_password_hash: 'grub.pbkdf2.sha512.changethispassword'  # pragma: allowlist secret

## Bootloader superuser
# This is the superuser account that will be used to access the bootloader.
# The default value can be changed but must not be a common name such as root, admin, or administrator.
# The default value is 'stig_boot_user'.
rhel10stig_grub_superuser: 'stig_boot_user'

####################################################

## Banner
rhel10stig_workaround_for_disa_benchmark: true

rhel10stig_logon_banner: "{{ rhel10stig_workaround_for_disa_benchmark | ternary(
        rhel10stig_logon_banner_nice | regex_replace('(?s)(?<!\\n)\\n(?!(\n|$))', ' '),
        rhel10stig_logon_banner_nice) }}"
rhel10stig_logon_banner_nice: |
    You are accessing a U.S. Government (USG) Information System (IS) that is
    provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent
    to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for
    purposes including, but not limited to, penetration testing, COMSEC monitoring,
    network operations and defense, personnel misconduct (PM), law enforcement
    (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject
    to routine monitoring, interception, and search, and may be disclosed or used
    for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access controls)
    to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM, LE
    or CI investigative searching or monitoring of the content of privileged
    communications, or work product, related to personal representation or services
    by attorneys, psychotherapists, or clergy, and their assistants. Such
    communications and work product are private and confidential. See User
    Agreement for details.

# Packages and services
rhel10stig_is_ftp_server: false
rhel10stig_nfs_utils_required: false

# TFTP server required
# If true, the TFTP server will be configured to operate in secure mode.
rhel10stig_tftp_server_required: false

# Add list of additional crypto subpolicies to be added to FIPS
rhel10stig_additional_fips_crypto_subpolicies: false
rhel10stig_additional_fips_crypto_subpolicies_list:
# - AD-SUPPORT
# - NO-ENFORCE-EMS

