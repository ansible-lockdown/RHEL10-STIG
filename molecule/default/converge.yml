---

- name: Converge - apply RHEL 10 STIG remediation
  hosts: all
  any_errors_fatal: true
  vars:
    setup_audit: true
    run_audit: true
    # audit_git_version can be set here now. It used to be inert: vars/audit.yml
    # was loaded with include_vars, which outranks play vars, so a value here was
    # discarded. That file is now defaults/main/audit.yml at defaults precedence,
    # so play vars win. Still overridable at run time with:
    #   molecule converge -- --extra-vars 'audit_git_version=<branch>'
    system_is_container: true
    skip_reboot: true
    # Molecule default - overrides role default (`false`) to exercise full code path
    rhel10stig_disruption_high: true
    fetch_audit_output: true
    audit_output_destination: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../_temp_fetched_audits/"
  pre_tasks:
    - name: Set root password so PAM rules don't lock us out
      ansible.builtin.user:
        name: root
        # The salt is pinned so the hash is stable between runs. Without it
        # password_hash generates a fresh salt each time, the user module sees a
        # different hash and always reports changed, which fails idempotence.
        password: "{{ 'changeme123!' | password_hash('sha512', 'moleculetestsalt') }}"
  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
