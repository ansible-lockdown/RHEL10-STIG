---
# Molecule verify - spot-checks a representative, container-applicable subset of the
# RHEL 10 STIG hardening the role applies. The authoritative validation is the Goss
# audit run during converge (run_audit: true); this playbook is a fast sanity gate so
# `molecule verify` is not a silent no-op.

- name: Verify - RHEL 10 STIG hardening spot-checks
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify | Read /etc/login.defs
      ansible.builtin.slurp:
        src: /etc/login.defs
      register: verify_login_defs

    - name: Verify | login.defs enforces STIG UMASK and SHA512 password hashing
      ansible.builtin.assert:
        that:
          - "'UMASK 077' in (verify_login_defs.content | b64decode)"
          - "'ENCRYPT_METHOD SHA512' in (verify_login_defs.content | b64decode)"
        fail_msg: "/etc/login.defs is not hardened (expected UMASK 077 and ENCRYPT_METHOD SHA512)"
        success_msg: "login.defs UMASK and password hashing hardened"

    - name: Verify | Stat the STIG sshd rekey-limit drop-in
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/49-stig-rekeylimit.conf
      register: verify_ssh_rekey

    - name: Verify | STIG sshd drop-in was created
      ansible.builtin.assert:
        that:
          - verify_ssh_rekey.stat.exists
        fail_msg: "Expected STIG sshd drop-in /etc/ssh/sshd_config.d/49-stig-rekeylimit.conf is missing"
        success_msg: "STIG sshd rekey-limit drop-in present"

    - name: Verify | Stat the login banner
      ansible.builtin.stat:
        path: /etc/issue
      register: verify_issue

    - name: Verify | Login banner (/etc/issue) is populated
      ansible.builtin.assert:
        that:
          - verify_issue.stat.exists
          - verify_issue.stat.size > 0
        fail_msg: "/etc/issue login banner is empty"
        success_msg: "Login banner populated"
