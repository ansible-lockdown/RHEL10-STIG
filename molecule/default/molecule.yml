---

dependency:
  name: galaxy
  options:
    requirements-file: collections/requirements.yml
driver:
  name: docker
platforms:
  - name: rhel10-stig-qa
    image: rockylinux/rockylinux:10-ubi-init
    # The image is multi-arch. Default keeps local Apple Silicon runs on arm64;
    # CI exports MOLECULE_DOCKER_PLATFORM=linux/amd64 for GitHub-hosted runners.
    platform: "${MOLECULE_DOCKER_PLATFORM:-linux/arm64}"
    pre_build_image: true
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN
provisioner:
  name: ansible
  log: true
  config_options:
    defaults:
      callbacks_enabled: profile_tasks,timer
  inventory:
    host_vars:
      rhel10-stig-qa:
        ansible_become: false
        setup_audit: true
        run_audit: true
        # audit_git_version can now be set here. It used to be inert: vars/audit.yml
        # was loaded with include_vars, which outranks host vars, so any value here
        # was discarded. That file is now defaults/main/audit.yml at defaults
        # precedence, so host vars win. Still overridable at run time with:
        #   molecule converge -- --extra-vars 'audit_git_version=<branch>'
        skip_reboot: true
        system_is_container: true
        # Override role default (`false` in defaults/main/main.yml) - safe in this
        # throwaway container, exercises the full disruption_high code paths.
        rhel10stig_disruption_high: true
        fetch_audit_output: true
        # Files land one level above the role repo (working dir root), e.g.
        # `<working_dir>/_temp_fetched_audits/`. Override with `-e audit_output_destination=...`
        # if you want them somewhere else.
        audit_output_destination: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../_temp_fetched_audits/"
verifier:
  name: ansible
